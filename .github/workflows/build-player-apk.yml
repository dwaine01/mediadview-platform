name: Build MediAd View Player APK

on:
  push:
    branches: [main]
    paths:
      - 'android-player/**'
      - '.github/workflows/build-player-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-player/**'
      - '.github/workflows/build-player-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── Do EVERYTHING in one bash script that captures logs from t=0 ───
      # so that even if a setup step dies early we still have the trace.
      - name: Build APK (self-contained, all logs captured)
        id: build
        continue-on-error: true  # diagnostics artifact must upload even after failure
        run: |
          set +e   # never abort — we want to reach the commit step
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "=========================================================="
          echo "  MediAd View Player — full build log"
          echo "  commit:  ${{ github.sha }}"
          echo "  run:     https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  time:    $(date -Iseconds)"
          echo "=========================================================="

          # ─── 1. JDK 17 ───────────────────────────────────────────
          echo "::group::Install JDK 17"
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk-headless unzip wget
          export JAVA_HOME=$(readlink -f /usr/bin/javac | sed "s:/bin/javac::")
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version
          echo "::endgroup::"

          # ─── 2. Android SDK ──────────────────────────────────────
          echo "::group::Install Android SDK"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          rm cmd.zip
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "SDK contents:"
          ls -la $ANDROID_HOME
          echo "::endgroup::"

          # ─── 3. Gradle 8.7 ───────────────────────────────────────
          echo "::group::Install Gradle 8.7"
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME/
          export PATH=$HOME/gradle-8.7/bin:$PATH
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version
          echo "::endgroup::"

          # ─── 4. Configure project ────────────────────────────────
          echo "::group::Configure project"
          cd $GITHUB_WORKSPACE/android-player
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "--- build.gradle.kts (top) ---"
          head -60 app/build.gradle.kts
          echo "::endgroup::"

          # ─── 5. Compile ──────────────────────────────────────────
          echo "::group::gradle assembleRelease"
          cd $GITHUB_WORKSPACE/android-player
          gradle assembleRelease --no-daemon --stacktrace --info
          BUILD_RC=$?
          echo "gradle exit code: $BUILD_RC"
          echo "::endgroup::"

          # ─── 6. Locate APK ───────────────────────────────────────
          echo "::group::Locate APK"
          find $GITHUB_WORKSPACE/android-player/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;
          APK=$(find $GITHUB_WORKSPACE/android-player/app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          echo "APK=$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "::endgroup::"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ No APK produced. Build failed."
            exit 1
          fi

          # ─── 7. Prepare immutable workflow artifacts ─────────────
          echo "::group::Prepare artifact"
          VERSION=$(grep 'versionName' $GITHUB_WORKSPACE/android-player/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/mediaview-player-v${VERSION}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/dist/mediaview-player-latest.apk"
          cp "$APK" "$GITHUB_WORKSPACE/dist/mediaview-player.apk"
          sha256sum "$GITHUB_WORKSPACE"/dist/*.apk > "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          ls -lh "$GITHUB_WORKSPACE/dist"
          echo "::endgroup::"

          echo "✅ BUILD SUCCEEDED"

      - name: Prepare build log artifact
        if: always()
        run: |
          mkdir -p build-artifacts
          tail -800 /tmp/build.log > build-artifacts/build.log 2>/dev/null || echo "(no log)" > build-artifacts/build.log
          {
            echo "=== BUILD METADATA ==="
            echo "status:   ${{ steps.build.outcome }}"
            echo "commit:   ${{ github.sha }}"
            echo "run_id:   ${{ github.run_id }}"
            echo "run_url:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time:     $(date -Iseconds)"
            echo "=================================="
            echo ""
          } | cat - build-artifacts/build.log > build-artifacts/build.tmp
          mv build-artifacts/build.tmp build-artifacts/build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mediaview-player-${{ steps.build.outputs.version }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish stable direct-download release
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="player-latest"
          VERSION="${{ steps.build.outputs.version }}"
          TITLE="MediaView Player v${VERSION} — Latest Stable"
          NOTES="Built from ${GITHUB_SHA}. Direct TV download: https://mediadview.com/apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/mediaview-player.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx mediaview-player.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaview-player-build-log-${{ github.run_number }}
          path: build-artifacts/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "❌ Build did not succeed — download the build-log artifact from this run"
          exit 1

      - name: Summary
        if: steps.build.outcome == 'success'
        run: |
          echo "## 🎉 MediAd View Player built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK available in this run's Artifacts section. No files were committed to main." >> $GITHUB_STEP_SUMMARY
