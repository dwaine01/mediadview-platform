name: Build MediAd View Player APK

on:
  push:
    branches: [main]
    paths:
      - 'android-player/**'
      - '.github/workflows/build-player-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── Do EVERYTHING in one bash script that captures logs from t=0 ───
      # so that even if a setup step dies early we still have the trace.
      - name: Build APK (self-contained, all logs captured)
        id: build
        continue-on-error: true  # so the log-commit step below always runs
        run: |
          set +e   # never abort — we want to reach the commit step
          exec > >(tee -a /tmp/build.log) 2>&1
          echo "=========================================================="
          echo "  MediAd View Player — full build log"
          echo "  commit:  ${{ github.sha }}"
          echo "  run:     https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  time:    $(date -Iseconds)"
          echo "=========================================================="

          # ─── 1. JDK 17 ───────────────────────────────────────────
          echo "::group::Install JDK 17"
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk-headless unzip wget
          export JAVA_HOME=$(readlink -f /usr/bin/javac | sed "s:/bin/javac::")
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version
          echo "::endgroup::"

          # ─── 2. Android SDK ──────────────────────────────────────
          echo "::group::Install Android SDK"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip
          mv cmdline-tools latest
          rm cmd.zip
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "SDK contents:"
          ls -la $ANDROID_HOME
          echo "::endgroup::"

          # ─── 3. Gradle 8.7 ───────────────────────────────────────
          echo "::group::Install Gradle 8.7"
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME/
          export PATH=$HOME/gradle-8.7/bin:$PATH
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version
          echo "::endgroup::"

          # ─── 4. Configure project ────────────────────────────────
          echo "::group::Configure project"
          cd $GITHUB_WORKSPACE/android-player
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "--- build.gradle.kts (top) ---"
          head -60 app/build.gradle.kts
          echo "::endgroup::"

          # ─── 5. Compile ──────────────────────────────────────────
          echo "::group::gradle assembleRelease"
          cd $GITHUB_WORKSPACE/android-player
          gradle assembleRelease --no-daemon --stacktrace --info
          BUILD_RC=$?
          echo "gradle exit code: $BUILD_RC"
          echo "::endgroup::"

          # ─── 6. Locate APK ───────────────────────────────────────
          echo "::group::Locate APK"
          find $GITHUB_WORKSPACE/android-player/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;
          APK=$(find $GITHUB_WORKSPACE/android-player/app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          echo "APK=$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "::endgroup::"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "❌ No APK produced. Build failed."
            exit 1
          fi

          # ─── 7. Deploy ───────────────────────────────────────────
          echo "::group::Copy APK to backend/web/"
          VERSION=$(grep 'versionName' $GITHUB_WORKSPACE/android-player/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp "$APK" "$GITHUB_WORKSPACE/backend/web/mediaview-player-v${VERSION}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/backend/web/mediaview-player.apk"
          ls -lh $GITHUB_WORKSPACE/backend/web/mediaview-player*.apk
          echo "::endgroup::"

          echo "✅ BUILD SUCCEEDED"

      # ─── ALWAYS commit the log back to the repo, success or fail ───
      - name: Commit APK and log
        if: always()
        run: |
          mkdir -p .build-logs
          # Truncate to last ~800 lines so the repo doesn't bloat
          tail -800 /tmp/build.log > .build-logs/latest.txt 2>/dev/null || echo "(no log)" > .build-logs/latest.txt
          {
            echo "=== BUILD METADATA ==="
            echo "status:   ${{ steps.build.outcome }}"
            echo "commit:   ${{ github.sha }}"
            echo "run_id:   ${{ github.run_id }}"
            echo "run_url:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time:     $(date -Iseconds)"
            echo "=================================="
            echo ""
          } | cat - .build-logs/latest.txt > .build-logs/latest.tmp
          mv .build-logs/latest.tmp .build-logs/latest.txt

          git config user.name  "MediAd View Bot"
          git config user.email "bot@mediadview.com"

          # Stage log always
          git add .build-logs/latest.txt

          # Stage APK if build succeeded
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git add backend/web/mediaview-player*.apk 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          if [ "${{ steps.build.outcome }}" = "success" ]; then
            git commit -m "build(apk): mediaview-player build ok [skip ci]"
          else
            git commit -m "ci(apk): build FAILED — see .build-logs/latest.txt [skip ci]"
          fi

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done

      - name: Fail workflow if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "❌ Build did not succeed — see .build-logs/latest.txt in the repo for full trace"
          exit 1

      - name: Summary
        if: steps.build.outcome == 'success'
        run: |
          echo "## 🎉 MediAd View Player built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK available at: https://mediadview.com/apk" >> $GITHUB_STEP_SUMMARY
