# ══════════════════════════════════════════════════════════════════════
# MediAd View — Continuous Integration
# ══════════════════════════════════════════════════════════════════════
# Runs on every push to main + every pull_request:
#   1. lint       → syntax / static checks (ruff)
#   2. test       → pytest suite against ephemeral Mongo + Redis
#   3. validate   → check .env.example completeness + secret scan
#   4. docker     → build the production image (fail-fast if Dockerfile broken)
#   5. deploy     → (disabled) hook to trigger Render deploy after CI green
#
# All secrets referenced below must be created in the repo Settings ▸
# Secrets and variables ▸ Actions before the deploy step is enabled.
# ══════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9
      - name: Run ruff
        run: ruff check backend --select E,F,W,I --ignore E501,E402,F401,F403,F841

  # ─────────────────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5

    env:
      ENVIRONMENT: test
      MONGO_URL:   mongodb://localhost:27017
      DB_NAME:     mediadview_ci
      REDIS_URL:   redis://localhost:6379
      JWT_SECRET:  ci-jwt-secret-not-used-in-prod-2626262626262626
      CORS_ORIGINS: http://localhost:3000
      SKIP_SEED:   "true"
      SCHEDULER_MODE: apscheduler
      LOG_LEVEL:   WARNING

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx requests
      - name: Smoke import
        working-directory: backend
        run: |
          python -c "from server import app; print('server imports OK')"
          python -c "from worker import WorkerSettings; print('worker imports OK')"
          python -c "from auth_v2 import build_auth_router; from health import build_health_router; print('auth+health OK')"
          python -c "from financial_ledger import append_entry, verify_chain; from refunds_service import request_refund; from credit_notes_service import issue_credit_note_for_refund; from reports_service import executive_dashboard; print('C3+C4 OK')"
          python -c "from security_headers import install; from media_validator import validate_magic_bytes; print('P0 modules OK')"

      # ── Smoke test suites (standalone python scripts) ────────────
      # These are the authoritative regression suites for MediaDView.
      - name: Smoke · Etapa A
        working-directory: backend
        run: python -m tests.smoke_etapa_a
      - name: Smoke · Etapa B v2 (checkout + slot atomic)
        working-directory: backend
        run: python -m tests.smoke_etapa_b_v2
      - name: Smoke · C3 (refunds + ledger + credit notes)
        working-directory: backend
        run: python -m tests.smoke_c3_refunds
      - name: Smoke · C4 (dashboard + exports + BI + WS)
        working-directory: backend
        run: python -m tests.smoke_c4_reports

      # ── pytest suite (if present) ────────────────────────────────
      - name: pytest (if any)
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py 1>/dev/null 2>&1; then
            pytest -q --tb=short --disable-warnings tests/test_*.py || exit 1
          else
            echo "no legacy pytest suite — smoke tests already passed."
          fi

  # ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · Playwright (admin panel)
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5

    env:
      ENVIRONMENT: test
      MONGO_URL:   mongodb://localhost:27017
      DB_NAME:     mediadview_ci_e2e
      REDIS_URL:   redis://localhost:6379
      JWT_SECRET:  ci-jwt-secret-not-used-in-prod-2626262626262626
      CORS_ORIGINS: http://localhost:8001
      COOKIE_SECURE: "false"
      SKIP_SEED:   "false"
      SEED_ADMIN_EMAIL: admin.demo@mediadview.com
      SEED_ADMIN_PASSWORD: AdminDemo#2026
      SEED_SUPERADMIN_EMAIL: superadmin@mediadview.com
      SEED_SUPERADMIN_PASSWORD: SuperAdmin#2026
      SCHEDULER_MODE: apscheduler
      LOG_LEVEL:   WARNING

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Boot backend in background
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1 > /tmp/uv.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/health > /dev/null && break || sleep 1
          done
          curl -sf http://localhost:8001/api/health || (cat /tmp/uv.log; exit 1)
      - name: Run E2E test suite
        working-directory: backend
        run: python -m tests.e2e_playwright

  # ─────────────────────────────────────────────────────────────────
  validate:
    name: Config & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env is NOT committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "❌ .env file is tracked in git — remove it before merging"
            exit 1
          fi
      - name: Ensure .env.example is up to date
        run: |
          test -f backend/.env.example
          for KEY in ENVIRONMENT MONGO_URL DB_NAME CORS_ORIGINS JWT_SECRET \
                     REDIS_URL COOKIE_DOMAIN STRIPE_SECRET_KEY R2_BUCKET_NAME \
                     SMTP_HOST SENTRY_DSN SCHEDULER_MODE ; do
            grep -q "^${KEY}=" backend/.env.example || { echo "❌ missing $KEY in .env.example"; exit 1; }
          done
          echo "✓ .env.example has all required keys"
      - name: Secret scan (gitleaks lite)
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --exclude-files 'package-lock.json|yarn.lock|.*\.min\.js' \
            --exclude-files 'android-player/.*\.jar' \
            --exclude-files 'backend/web/(app|finance|finance-extras)\.js' \
            > secrets-report.json
          # Fail if any HIGH-confidence secret is found
          python -c "
          import json
          with open('secrets-report.json') as f:
              r = json.load(f)
          bad = [k for k,v in r.get('results',{}).items() if v]
          if bad:
              print('❌ potential secrets in:', bad)
              exit(1)
          print('✓ no leaked secrets')
          "

  # ─────────────────────────────────────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push in PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mediadview-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-boot the container
        run: |
          docker run -d --name mediadview_ci \
            -e ENVIRONMENT=test \
            -e MONGO_URL=mongodb://host.docker.internal:27017 \
            -e JWT_SECRET=ci \
            -e SKIP_SEED=true \
            -p 8001:8001 mediadview-backend:ci-${{ github.sha }} || true
          sleep 3
          docker logs mediadview_ci | tail -30
          docker rm -f mediadview_ci

  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Guarded: enable only after RENDER_DEPLOY_HOOK_URL secret is set in
    # the repository settings. Until then this job is skipped safely.
    steps:
      - name: Skip if hook not configured
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "hook_configured=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy — RENDER_DEPLOY_HOOK_URL not set."
          else
            echo "hook_configured=true"  >> $GITHUB_OUTPUT
          fi
      - name: Trigger Render deploy
        if: steps.check.outputs.hook_configured == 'true'
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✓ Render deploy triggered"
