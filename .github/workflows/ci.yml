# ══════════════════════════════════════════════════════════════════════
# MediAd View — Continuous Integration
# ══════════════════════════════════════════════════════════════════════
# Runs on every push to main + every pull_request:
#   1. lint       → syntax / static checks (ruff)
#   2. test       → pytest suite against ephemeral Mongo + in-memory limits
#   3. validate   → check .env.example completeness + secret scan
#   4. docker     → build the production image (fail-fast if Dockerfile broken)
#   5. deploy     → (disabled) hook to trigger Render deploy after CI green
#
# All secrets referenced below must be created in the repo Settings ▸
# Secrets and variables ▸ Actions before the deploy step is enabled.
# ══════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9
      - name: Run ruff
        run: ruff check backend --select E,F,W,I --ignore E501,E402,F401,F403,F841

  # ─────────────────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      MONGO_URL:   mongodb://localhost:27017
      DB_NAME:     mediadview_ci
      # The rate-limit regression tests restart Uvicorn to clear counters.
      # Keep CI on memory://; Redis persistence is an integration concern, not
      # part of this deterministic backend suite.
      REDIS_URL:   ""
      JWT_SECRET:  ci-jwt-secret-not-used-in-prod-2626262626262626
      CORS_ORIGINS: http://localhost:3000
      SKIP_SEED:   "false"
      SEED_ADMIN_EMAIL: admin.demo@mediadview.com
      SEED_ADMIN_PASSWORD: AdminDemo#2026
      TEST_ADMIN_EMAIL: admin.demo@mediadview.com
      TEST_ADMIN_PASSWORD: AdminDemo#2026
      SEED_SUPERADMIN_EMAIL: superadmin@mediadview.com
      SEED_SUPERADMIN_PASSWORD: SuperAdmin#2026
      TEST_BASE_URL: http://127.0.0.1:8001
      EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
      PUBLIC_URL: http://127.0.0.1:8001
      STORAGE_DRIVER: local
      PANEL_URL: http://127.0.0.1:8001/api/dashboard
      PANEL_API_URL: http://127.0.0.1:8001
      SCHEDULER_MODE: apscheduler
      LOG_LEVEL:   WARNING

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx requests
      - name: Smoke import
        working-directory: backend
        run: |
          python -c "from server import app; print('server imports OK')"
          python -c "from worker import WorkerSettings; print('worker imports OK')"
          python -c "from auth_v2 import build_auth_router; from health import build_health_router; print('auth+health OK')"
          python -c "from financial_ledger import append_entry, verify_chain; from refunds_service import request_refund; from credit_notes_service import issue_credit_note_for_refund; from reports_service import executive_dashboard; print('C3+C4 OK')"
          python -c "from security_headers import install; from media_validator import validate_magic_bytes; print('P0 modules OK')"

      - name: Boot test backend
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/ci-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8001/api/health && exit 0
            sleep 1
          done
          cat /tmp/ci-backend.log
          exit 1

      # ── Smoke test suites (standalone python scripts) ────────────
      # These are the authoritative regression suites for MediaDView.
      - name: Smoke · Etapa A
        working-directory: backend
        run: python -m tests.smoke_etapa_a
      - name: Smoke · Etapa B v2 (checkout + slot atomic)
        working-directory: backend
        run: python -m tests.smoke_etapa_b_v2
      - name: Smoke · C3 (refunds + ledger + credit notes)
        working-directory: backend
        run: python -m tests.smoke_c3_refunds
      - name: Smoke · C4 (dashboard + exports + BI + WS)
        working-directory: backend
        run: python -m tests.smoke_c4_reports

      # ── Seed RBAC test users (needed by test_fase3_advertising + test_rbac_fase1) ──
      - name: Seed RBAC test users
        run: |
          SA_TOKEN=$(curl -sf -X POST http://127.0.0.1:8001/api/auth/v2/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$SEED_SUPERADMIN_EMAIL\",\"password\":\"$SEED_SUPERADMIN_PASSWORD\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          STATUS=$(curl -sf -X POST http://127.0.0.1:8001/api/admin/rbac/seed-test-users \
            -H "Authorization: Bearer $SA_TOKEN" \
            -H "Content-Type: application/json" \
            -w "%{http_code}" -o /tmp/rbac-seed.json)
          cat /tmp/rbac-seed.json
          echo ""
          echo "RBAC seed status: $STATUS"
          [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 201 ] || exit 1

      # ── pytest suite (if present) ────────────────────────────────
      - name: pytest (if any)
        working-directory: backend
        run: |
          if [ -d tests ] && ls tests/test_*.py 1>/dev/null 2>&1; then
            pytest -q --tb=short --disable-warnings \
              --junitxml=/tmp/pytest-results.xml tests/test_*.py
          else
            echo "no legacy pytest suite — smoke tests already passed."
          fi

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics-${{ github.run_number }}
          path: |
            /tmp/ci-backend.log
            /tmp/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · Playwright (admin panel)
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5

    env:
      ENVIRONMENT: test
      MONGO_URL:   mongodb://localhost:27017
      DB_NAME:     mediadview_ci_e2e
      REDIS_URL:   redis://localhost:6379
      JWT_SECRET:  ci-jwt-secret-not-used-in-prod-2626262626262626
      CORS_ORIGINS: http://localhost:8001
      COOKIE_SECURE: "false"
      SKIP_SEED:   "false"
      SEED_ADMIN_EMAIL: admin.demo@mediadview.com
      SEED_ADMIN_PASSWORD: AdminDemo#2026
      SEED_SUPERADMIN_EMAIL: superadmin@mediadview.com
      SEED_SUPERADMIN_PASSWORD: SuperAdmin#2026
      SCHEDULER_MODE: apscheduler
      LOG_LEVEL:   WARNING

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Boot backend in background
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1 > /tmp/uv.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/health > /dev/null && break || sleep 1
          done
          curl -sf http://localhost:8001/api/health || (cat /tmp/uv.log; exit 1)
      - name: Run E2E test suite
        working-directory: backend
        run: python -m tests.e2e_playwright

  # ─────────────────────────────────────────────────────────────────
  validate:
    name: Config & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env is NOT committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "❌ .env file is tracked in git — remove it before merging"
            exit 1
          fi
      - name: Ensure .env.example is up to date
        run: |
          test -f backend/.env.example
          for KEY in ENVIRONMENT MONGO_URL DB_NAME CORS_ORIGINS JWT_SECRET \
                     REDIS_URL COOKIE_DOMAIN STRIPE_SECRET_KEY R2_BUCKET \
                     RESEND_API_KEY SENTRY_DSN SCHEDULER_MODE ; do
            grep -q "^${KEY}=" backend/.env.example || { echo "❌ missing $KEY in .env.example"; exit 1; }
          done
          echo "✓ .env.example has all required keys"
      - name: High-confidence secret scan
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          patterns = {
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}"),
              "Stripe live secret": re.compile(r"sk_live_[A-Za-z0-9]{16,}"),
              "OpenAI secret": re.compile(r"sk-[A-Za-z0-9]{20,}"),
              "AWS access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "credentialed Mongo URI": re.compile(r"mongodb(?:\+srv)?://(?!localhost|<)[^:\s/]+:[^@\s]+@"),
          }
          ignored_parts = {".git", ".metro-cache", "node_modules", "tests", "docs"}
          findings = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for filename in tracked:
              if not filename:
                  continue
              path = pathlib.Path(filename)
              if ignored_parts.intersection(path.parts) or path.suffix in {".apk", ".jar", ".mp4"}:
                  continue
              try:
                  text = path.read_text(errors="ignore")
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{filename}: {label}")
          if findings:
              print("❌ high-confidence credentials found:")
              print("\n".join(findings))
              raise SystemExit(1)
          print("✓ no high-confidence credentials found")
          PY

  # ─────────────────────────────────────────────────────────────────
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push in PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mediadview-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-boot the container
        run: |
          docker run -d --name mediadview_ci \
            -e ENVIRONMENT=test \
            -e MONGO_URL=mongodb://host.docker.internal:27017 \
            -e JWT_SECRET=ci \
            -e SKIP_SEED=true \
            -p 8001:8001 mediadview-backend:ci-${{ github.sha }} || true
          sleep 3
          docker logs mediadview_ci | tail -30
          docker rm -f mediadview_ci

  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Guarded: enable only after RENDER_DEPLOY_HOOK_URL secret is set in
    # the repository settings. Until then this job is skipped safely.
    steps:
      - name: Skip if hook not configured
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "hook_configured=false" >> $GITHUB_OUTPUT
            echo "Skipping deploy — RENDER_DEPLOY_HOOK_URL not set."
          else
            echo "hook_configured=true"  >> $GITHUB_OUTPUT
          fi
      - name: Trigger Render deploy
        if: steps.check.outputs.hook_configured == 'true'
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✓ Render deploy triggered"
