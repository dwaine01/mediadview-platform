workflows:
  build-mediaview-player:
    name: MediAd View Player APK
    max_build_duration: 30
    environment:
      java: 17
      groups:
        - github_secrets
      vars:
        PACKAGE_NAME: "com.mediaview.player"
        GITHUB_REPO: "dwaine01/mediadview-platform"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Prepare project
        script: |
          cd android-player
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          echo "--- Version info ---"
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APK_VERSION=$VERSION" >> $CM_ENV
          echo "Building version: $VERSION"
      - name: Run Android contract tests
        script: |
          cd android-player
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew testDiagnosticUnitTest --stacktrace
          else
            gradle testDiagnosticUnitTest --stacktrace
          fi
      - name: Build diagnostic APK
        script: |
          cd android-player
          if [ -f ./gradlew ]; then
            ./gradlew assembleDiagnostic --stacktrace
          else
            gradle assembleDiagnostic --stacktrace
          fi
      - name: Locate and rename APK
        script: |
          set -euo pipefail
          APK_SRC=$(find android-player/app/build/outputs/apk/diagnostic -type f -name "*.apk" | head -1)
          echo "Built APK: $APK_SRC"
          if [ -z "$APK_SRC" ]; then
            echo "No APK found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SRC" "dist/mediaview-player-v${APK_VERSION}-diagnostic.apk"
          cp "$APK_SRC" "dist/mediaview-player-latest-diagnostic.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS
          ls -lh dist/
          echo "APK v${APK_VERSION} ready as a Codemagic artifact; main remains source-only."
    artifacts:
      - dist/*.apk
      - dist/SHA256SUMS
    publishing:
      email:
        recipients:
          - mediaview.llc@gmail.com
        notify:
          success: true
          failure: true
