# Ruff config for the MediAd View backend.
#
# We inherit the CI command flags but silence a set of legacy formatting
# issues that predate the current refactoring push. New code should not
# introduce these — anything not listed here still fails CI.
line-length = 120

[lint]
# Match the CI flags: ruff check --select E,F,W,I --ignore ...
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — enforced by black/formatter, not lint
    "E402",  # module import not at top (legacy patterns rely on it)
    "F401",  # imported but unused (legacy re-exports)
    "F403",  # star import
    "F841",  # local variable assigned but never used
    # ── legacy backlog (pre-existing multi-statement lines) ──
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable name (l, I, O)
    "E731",  # do not assign a lambda expression
    "F811",  # redefinition of unused name
    "W293",  # whitespace on blank line
    "W605",  # invalid escape sequence (legacy regex strings)
]

[lint.per-file-ignores]
# Auto-generated / vendored / tests
"tests/*" = ["E501", "F401", "F811"]
"web/*"   = ["ALL"]
