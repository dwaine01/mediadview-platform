<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediAd View — Book Your Ad Space</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030712;color:#e2e8f0;min-height:100vh}
.hd{padding:14px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(30,41,59,.4)}
.hd img{height:30px}.hd span{font-size:9px;color:#22d3ee;letter-spacing:2px;font-weight:600}
.ct{max-width:1100px;margin:0 auto;padding:20px 24px}
.lbl{font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.inp{width:100%;padding:10px 12px;background:#0f172a;border:1px solid #1e293b;border-radius:8px;color:#f1f5f9;font-size:13px;font-family:inherit;transition:border .15s}
.inp:focus{border-color:#6366f1;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-go{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.3);font-family:inherit;transition:all .15s}
.btn-go:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.btn-go:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* Marketplace */
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;padding:10px 14px;background:#111827;border:1px solid #1e293b;border-radius:10px;color:#f1f5f9;font-size:14px;font-family:inherit}
.search input:focus{border-color:#6366f1;outline:none}
.search input::placeholder{color:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sc{background:#111827;border:1px solid #1e293b;border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.sc:hover{border-color:rgba(99,102,241,.4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.sc .im{height:68px;position:relative}.sc .ref{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.5);color:#fff}
.sc .cty{position:absolute;bottom:6px;left:6px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600;background:rgba(0,0,0,.4);color:#fff}
.sc .bd{padding:10px 12px}.sc .nm{font-size:13px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .lc{font-size:10px;color:#64748b;margin-bottom:6px}.sc .ft{display:flex;justify-content:space-between;align-items:center}
.sc .pr{font-size:15px;font-weight:800;color:#22d3ee}.sc .pr span{font-size:9px;color:#475569;font-weight:400}
.sc .sp{font-size:9px;color:#475569}
.btn-s{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .15s}
.upload{border:2px dashed #1e293b;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .15s}
.upload:hover{border-color:rgba(99,102,241,.4)}
.prev{margin-top:8px;border-radius:8px;overflow:hidden;max-height:160px}.prev img{width:100%;object-fit:contain;max-height:160px}
.pbox{background:rgba(34,211,238,.04);border:1px solid rgba(34,211,238,.1);border-radius:10px;padding:14px;margin:10px 0}
.prow{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:3px}
.ptot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:8px;margin-top:8px;border-top:1px solid rgba(30,41,59,.4)}
.ptot .v{color:#22d3ee}
.msg{padding:8px;border-radius:6px;font-size:12px;margin-top:8px;text-align:center}
.msg-e{background:rgba(239,68,68,.1);color:#f87171}
.hidden{display:none}
.ok-box{text-align:center;padding:36px;background:#111827;border-radius:14px;border:1px solid rgba(52,211,153,.2);margin:40px 0}
.ok-box h2{color:#34d399;font-size:22px;margin:10px 0 6px}
</style>
</head>
<body>
<div class="hd"><img src="/api/web/logo.png" alt="MediAd View"><span>DIGITAL SIGNAGE PLATFORM</span></div>
<div class="ct" id="root"></div>
<script>
var S=[],G=['linear-gradient(135deg,#1e40af,#3b82f6)','linear-gradient(135deg,#c2410c,#f97316)','linear-gradient(135deg,#0f766e,#14b8a6)','linear-gradient(135deg,#6d28d9,#a78bfa)','linear-gradient(135deg,#b45309,#f59e0b)','linear-gradient(135deg,#be185d,#f472b6)','linear-gradient(135deg,#047857,#34d399)','linear-gradient(135deg,#4338ca,#818cf8)','linear-gradient(135deg,#0e7490,#22d3ee)','linear-gradient(135deg,#be123c,#fb7185)'];
var fb=null,fn='',ft='',did=new URLSearchParams(location.search).get('id');

async function init(){
  var r=await fetch('/api/screens');S=await r.json();
  S.forEach(function(s,i){s.ref=String(1001+i);s._g=G[i%G.length]});
  did?showDetail():showMarketplace();
}

function showMarketplace(){
  var el=document.getElementById('root');
  el.innerHTML='<h1 style="font-size:26px;font-weight:800;margin-bottom:3px">Book Your Ad Space</h1><p style="font-size:13px;color:#64748b;margin-bottom:16px">Choose a screen to display your advertisement</p>'+
  '<div class="search"><input id="q" placeholder="Search by city, address, or screen #..." oninput="fil()"></div>'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:12px;color:#64748b" id="tot"></span></div>'+
  '<div class="grid" id="gr"></div>';
  fil();
}

function fil(){
  var q=(document.getElementById('q')?.value||'').toLowerCase();
  var list=q?S.filter(function(s){return s.name.toLowerCase().indexOf(q)>=0||s.location.city.toLowerCase().indexOf(q)>=0||s.location.address.toLowerCase().indexOf(q)>=0||s.location.state.toLowerCase().indexOf(q)>=0||s.ref.indexOf(q)>=0}):S;
  document.getElementById('tot').textContent=list.length+' screens';
  document.getElementById('gr').innerHTML=list.map(function(s){
    return'<div class="sc" onclick="window.location.href=\'/api/screen?id='+s.id+'\'"><div class="im" style="background:'+s._g+'"><span class="ref">#'+s.ref+'</span><span class="cty">'+s.location.city+', '+s.location.state+'</span></div><div class="bd"><div class="nm">'+s.name+'</div><div class="lc">'+s.location.address+'</div><div class="ft"><span class="sp">'+s.specs.size+'</span><span class="pr">$'+s.pricing.per_day+'<span>/day</span></span></div></div></div>';
  }).join('');
}

function showDetail(){
  var s=S.find(function(x){return x.id===did});
  if(!s){document.getElementById('root').innerHTML='<p style="color:#f87171;padding:40px">Screen not found</p>';return}
  var el=document.getElementById('root');
  el.innerHTML=
  '<a onclick="window.location.href=\'/api/screen\'" style="font-size:12px;color:#6366f1;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>All Screens</a>'+

  // Hero
  '<div style="background:'+s._g+';border-radius:16px;padding:24px 28px;margin-bottom:16px;position:relative;overflow:hidden">'+
  '<div style="position:absolute;top:10px;right:14px;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;color:#fff;backdrop-filter:blur(4px)">#'+s.ref+'</div>'+
  '<div style="font-size:28px;font-weight:800;color:#fff;margin-bottom:4px">'+s.name+'</div>'+
  '<div style="font-size:14px;color:rgba(255,255,255,.8)">'+s.location.address+', '+s.location.city+', '+s.location.state+'</div></div>'+

  // Info row: specs + pricing side by side, compact
  '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">'+
  '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px"><div style="font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Specs</div><div style="font-size:12px;color:#94a3b8;line-height:1.8">'+s.specs.size+'<br>'+s.specs.resolution+'<br>'+s.specs.type+' · '+(s.specs.orientation||'Landscape')+'</div></div>'+
  '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center"><div style="font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Price</div><div style="font-size:36px;font-weight:800;color:#22d3ee;line-height:1">$'+s.pricing.per_day+'</div><div style="font-size:11px;color:#64748b;margin-top:4px">per day</div></div>'+
  '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px"><div style="font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Details</div><div style="font-size:12px;color:#94a3b8;line-height:1.8">$'+s.pricing.per_hour+'/hour<br>$'+s.pricing.per_slot+'/slot<br>24/7 display</div></div></div>'+

  // Description
  '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:14px"><div style="font-size:12px;color:#94a3b8;line-height:1.7">'+(s.description||'Premium digital display in a high-traffic location. Maximum visibility for your brand, promotions, and events. Content displayed in rotation on high-resolution LED screen.')+'</div></div>'+

  // Terms - compact, no yellow
  '<div style="background:#0f172a;border:1px solid rgba(99,102,241,.15);border-radius:10px;padding:14px;margin-bottom:16px">'+
  '<div style="font-size:11px;font-weight:700;color:#818cf8;margin-bottom:8px">Terms & Conditions</div>'+
  '<div style="font-size:10px;color:#64748b;line-height:1.8;columns:2;column-gap:20px">'+
  '• Content must comply with advertising laws<br>'+
  '• MediAd View may reject content without notice<br>'+
  '• No offensive or illegal content accepted<br>'+
  '• Payment required before content goes live<br>'+
  '• Content displayed during selected dates<br>'+
  '• Refunds subject to cancellation policy<br>'+
  '• Format: JPG, PNG, or MP4 (1920×1080)<br>'+
  '• MediAd View not liable for content accuracy</div></div>'+

  // Booking form - compact card
  '<div style="background:#111827;border:1px solid rgba(34,211,238,.15);border-radius:14px;padding:20px">'+
  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:17px;font-weight:700">Book This Screen</div><div style="font-size:11px;color:#22d3ee">'+s.name+'</div></div><div style="font-size:12px;color:#64748b">#'+s.ref+'</div></div>'+

  '<div class="row2" style="margin-bottom:8px"><div><div class="lbl">Start Date</div><input type="date" class="inp" id="b-s" onchange="calcD()"></div><div><div class="lbl">End Date</div><input type="date" class="inp" id="b-e" onchange="calcD()"></div></div>'+
  '<div id="prc" class="pbox hidden"></div>'+

  '<div style="margin:10px 0"><div class="lbl">Upload Your Ad</div><div class="upload" onclick="document.getElementById(\'b-f\').click()"><svg width="24" height="24" fill="none" stroke="#475569" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><div style="font-size:12px;color:#64748b;margin-top:4px">Tap to upload image or video</div></div><input type="file" id="b-f" accept="image/*,video/mp4" style="display:none" onchange="onF(this)"><div id="b-pv" class="prev hidden"></div><div id="b-fn" style="font-size:11px;color:#22d3ee;margin-top:4px" class="hidden"></div></div>'+

  '<div class="row2" style="margin-bottom:10px"><div><div class="lbl">Your Name</div><input class="inp" id="b-n" placeholder="Full name"></div><div><div class="lbl">Email</div><input class="inp" id="b-m" placeholder="you@company.com" type="email"></div></div>'+

  '<label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="b-t" style="margin-top:2px;accent-color:#6366f1"><span style="font-size:10px;color:#64748b">I accept the Terms & Conditions and agree that MediAd View reserves the right to approve or reject any content</span></label>'+

  '<button class="btn-go" id="btn-go" onclick="book()">Submit & Pay</button>'+
  '<div id="bmsg" class="hidden"></div></div>';

  var t=new Date().toISOString().split('T')[0];
  document.getElementById('b-s').min=t;document.getElementById('b-e').min=t;
  window._s=s;
}

function calcD(){
  var s=window._s;if(!s)return;
  var sd=document.getElementById('b-s').value,ed=document.getElementById('b-e').value;
  if(!sd||!ed){document.getElementById('prc').classList.add('hidden');return}
  var days=Math.max(Math.ceil((new Date(ed)-new Date(sd))/86400000)+1,1);
  var sub=s.pricing.per_day*days,tax=Math.round(sub*.08*100)/100,tot=sub+tax;
  document.getElementById('prc').innerHTML=
    '<div class="prow"><span>'+days+' day'+(days>1?'s':'')+' × $'+s.pricing.per_day+'/day</span><span>$'+sub.toLocaleString()+'</span></div>'+
    '<div class="prow"><span>Tax (8%)</span><span>$'+tax.toLocaleString()+'</span></div>'+
    '<div class="ptot"><span>Total</span><span class="v">$'+tot.toLocaleString()+'</span></div>';
  document.getElementById('prc').classList.remove('hidden');
  document.getElementById('btn-go').textContent='Submit & Pay — $'+tot.toLocaleString();
}

function onF(i){var f=i.files[0];if(!f)return;fn=f.name;ft=f.type||'image/jpeg';
  document.getElementById('b-fn').textContent=f.name;document.getElementById('b-fn').classList.remove('hidden');
  var r=new FileReader();r.onload=function(){fb=r.result.split(',')[1];if(f.type.startsWith('image/')){document.getElementById('b-pv').innerHTML='<img src="'+r.result+'">';document.getElementById('b-pv').classList.remove('hidden')}};r.readAsDataURL(f)}

async function book(){
  if(!document.getElementById('b-t')?.checked){showMsg('Please accept Terms & Conditions');return}
  var nm=document.getElementById('b-n').value,em=document.getElementById('b-m').value,sd=document.getElementById('b-s').value,ed=document.getElementById('b-e').value;
  if(!nm||!em||!sd||!ed||!fb){showMsg('Please fill all fields and upload media');return}
  var btn=document.getElementById('btn-go');btn.disabled=true;btn.textContent='Processing...';
  try{
    var au;try{var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:'cl_'+em})});if(!r.ok)throw 0;au=await r.json()}catch(e){au=await(await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,email:em,password:'cl_'+em})})).json()}
    var h={'Content-Type':'application/json','Authorization':'Bearer '+au.access_token};
    var m=await(await fetch('/api/media/upload',{method:'POST',headers:h,body:JSON.stringify({filename:fn,content_type:ft,data:fb})})).json();
    var s=window._s;
    var c=await(await fetch('/api/campaigns',{method:'POST',headers:h,body:JSON.stringify({name:nm+' — '+s.name,screen_id:s.id,schedule:{start_date:sd,end_date:ed,start_time:'00:00',end_time:'23:59',slot_duration:15,frequency:5},media_ids:[m.id]})})).json();
    await fetch('/api/payments',{method:'POST',headers:h,body:JSON.stringify({campaign_id:c.id,method:'card',card_last4:'4242'})});
    document.getElementById('root').innerHTML='<div class="ok-box"><svg width="44" height="44" fill="none" stroke="#34d399" stroke-width="2" viewBox="0 0 24 24" style="margin:0 auto"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><h2>Ad Submitted!</h2><p style="color:#94a3b8;font-size:13px">Your ad for <strong>'+s.name+'</strong> is pending approval. It will appear on screen once approved.</p><button onclick="location.href=\'/api/screen\'" style="margin-top:16px;padding:8px 18px;border-radius:8px;background:rgba(99,102,241,.1);color:#818cf8;border:1px solid rgba(99,102,241,.2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Book Another Screen</button></div>';
  }catch(e){showMsg(e.message);btn.disabled=false;btn.textContent='Submit & Pay'}
}

function showMsg(t){var m=document.getElementById('bmsg');m.className='msg msg-e';m.textContent=t;m.classList.remove('hidden')}

init();
</script>
</body>
</html>
