<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión — MediAd View</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#020617 0%,#0a0f1a 100%);color:#e2e8f0;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:60px 20px}
.top{padding:14px 0 24px;display:flex;align-items:center;justify-content:center;gap:8px}
.top img{height:36px}
.top-tag{font-size:9px;color:#22d3ee;letter-spacing:2px;font-weight:800;padding:3px 10px;border:1px solid #22d3ee55;border-radius:12px}
.h1{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
.sub{font-size:14px;color:#94a3b8;text-align:center;margin-bottom:22px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:22px}
.lbl{display:block;font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;background:#020617;border:1.5px solid #1e293b;border-radius:10px;color:#f1f5f9;font-size:14px;font-family:inherit;color-scheme:dark}
.inp:focus{border-color:#6366f1;outline:none}
.field{margin-bottom:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.32);margin-top:8px;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:wait}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;padding:12px;border-radius:10px;margin-bottom:14px;font-size:13px}
.foot{margin-top:18px;text-align:center;font-size:13px;color:#94a3b8}
.foot a{color:#a5b4fc;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/api/web/logo-new.png" alt="MediAd View"><span class="top-tag">DIGITAL SIGNAGE</span></div>
  <h1 class="h1">Bienvenido de vuelta</h1>
  <p class="sub">Ingresa a tu cuenta para publicar tus anuncios.</p>
  <div id="err" class="err" style="display:none"></div>
  <div class="card">
    <div class="field"><label class="lbl">Email</label><input id="email" class="inp" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" autofocus></div>
    <div class="field"><label class="lbl">Contraseña</label><input id="pwd" class="inp" type="password" placeholder="Tu contraseña" autocomplete="current-password"></div>
    <button id="btn" class="btn" onclick="submit()">Iniciar sesión →</button>
  </div>
  <p class="foot">¿No tienes cuenta? <a id="signupLink" href="/signup">Crear una cuenta gratis</a></p>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var scanScreen = params.get('screen');
  var scanCode = params.get('code');
  if (scanScreen || scanCode) {
    var q = new URLSearchParams();
    if (scanScreen) q.set('screen', scanScreen);
    if (scanCode) q.set('code', scanCode);
    document.getElementById('signupLink').href = '/signup?' + q.toString();
  }
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  function showErr(msg){ err.textContent = msg; err.style.display = 'block'; }
  window.submit = async function(){
    err.style.display = 'none';
    var email = (document.getElementById('email').value||'').trim().toLowerCase();
    var pwd = document.getElementById('pwd').value||'';
    if (!email || !pwd) return showErr('Ingresa email y contraseña.');
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try{
      var res = await fetch('/api/auth/v2/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: email, password: pwd })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Credenciales inválidas.');
      try { localStorage.setItem('mv_token', data.access_token); } catch(e){}
      var role = (data.user||{}).role;
      // Customers go to /portal, staff go to the admin panel.
      var target = role === 'customer' ? '/portal' : '/api/dashboard';
      if (role === 'customer') {
        var qs = [];
        if (scanScreen) qs.push('highlight=' + encodeURIComponent(scanScreen));
        if (scanCode) qs.push('code=' + encodeURIComponent(scanCode));
        if (qs.length) target += '?' + qs.join('&');
      }
      location.replace(target);
    } catch(e){
      showErr(e.message || 'Error al iniciar sesión.');
      btn.disabled = false; btn.textContent = 'Iniciar sesión →';
    }
  };
})();
</script>
</body>
</html>
