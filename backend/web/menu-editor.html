<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Menu Editor — MediAd View</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f1a;--bg2:#111827;--bg3:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--cyan:#22d3ee;--brand:#6366f1;--green:#34d399;--red:#f43f5e;--amber:#fbbf24}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bg3);padding:12px 16px;display:flex;align-items:center;gap:12px}
.top-back{background:none;border:none;color:var(--cyan);font-size:24px;cursor:pointer;padding:4px}
.top-info{flex:1;min-width:0}
.top-name{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-sub{font-size:11px;color:var(--text3)}
.top-btn{background:var(--brand);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}

/* LIST VIEW */
.list-header{padding:24px 16px 12px}
.list-header h1{font-size:24px;font-weight:900}
.list-header p{font-size:13px;color:var(--text3);margin-top:4px}
.menu-card{margin:8px 12px;background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:border-color .2s}
.menu-card:active{border-color:var(--cyan)}
.menu-card-color{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;color:#fff}
.menu-card-info{flex:1;min-width:0}
.menu-card-name{font-size:15px;font-weight:700}
.menu-card-meta{font-size:11px;color:var(--text3);margin-top:2px}
.menu-card-arrow{color:var(--text3);font-size:18px}
.create-btn{display:block;margin:16px 12px;padding:16px;background:linear-gradient(135deg,var(--brand),var(--cyan));border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;text-align:center;width:calc(100% - 24px)}
.create-btn:active{opacity:.9}

/* TEMPLATE PICKER */
.tpl-grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl-card{background:var(--bg2);border:2px solid var(--bg3);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.tpl-card.selected{border-color:var(--cyan)}
.tpl-card:active{border-color:var(--cyan)}
.tpl-preview{height:50px;display:flex;align-items:center;justify-content:center}
.tpl-preview span{font-size:11px;font-weight:800;letter-spacing:1px}
.tpl-name{padding:8px 10px;font-size:12px;font-weight:700}
.tpl-type{font-size:10px;color:var(--text3)}

/* EDITOR */
.cat{margin:12px}
.cat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px 12px 0 0}
.cat-name{flex:1;font-size:15px;font-weight:800;color:var(--cyan);cursor:pointer}
.cat-btn{background:none;border:1px solid var(--bg3);color:var(--text2);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
.cat-btn:active{background:var(--bg3)}
.cat-del{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px}

.item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--bg3);border-top:none}
.item:last-child{border-radius:0 0 12px 12px}
.item-img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--bg3);cursor:pointer}
.item-placeholder{width:48px;height:48px;border-radius:10px;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.item-info{flex:1;min-width:0;cursor:pointer}
.item-name{font-size:14px;font-weight:700}
.item-desc{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-price{font-size:18px;font-weight:900;color:var(--cyan);cursor:pointer;padding:6px 10px;border-radius:8px;min-width:70px;text-align:right}
.item-price:active{background:rgba(34,211,238,.1)}
.item-featured{border-left:3px solid var(--cyan);background:rgba(34,211,238,.02)}
.item-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px}
.empty{text-align:center;padding:24px;color:var(--text3);font-size:13px;background:var(--bg2);border:1px solid var(--bg3);border-top:none;border-radius:0 0 12px 12px}

.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:center;z-index:40}

.preview-link{display:block;text-align:center;padding:12px;color:var(--cyan);font-size:13px;font-weight:600;margin:12px;border:1px dashed var(--bg3);border-radius:10px}

.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;max-width:500px;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-bar{width:40px;height:4px;border-radius:2px;background:var(--bg3);margin:0 auto 16px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--bg3);color:var(--text);padding:12px;border-radius:10px;font-size:15px;font-family:inherit;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--cyan)}
.field textarea{height:60px;resize:none}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.btn-full{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-save{background:var(--brand);color:#fff}
.btn-del{background:none;border:1px solid var(--red);color:var(--red)}
.toggle-switch{width:44px;height:24px;border-radius:12px;background:var(--bg3);position:relative;cursor:pointer;transition:background .2s;display:inline-block}
.toggle-switch.on{background:var(--cyan)}
.toggle-switch::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s}
.toggle-switch.on::after{left:22px}
.pad-bottom{padding-bottom:90px}
</style>
</head>
<body>

<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"><div class="sheet-bar"></div><div id="sheet-content"></div></div></div>

<script>
var API='/api';
var token=localStorage.getItem('mv_t');
var menuId=new URLSearchParams(location.search).get('id');
var menu=null,currSym='$',templates=[];

async function api(p,o={}){
  var h={'Content-Type':'application/json'};
  if(token)h['Authorization']='Bearer '+token;
  var r=await fetch(API+p,{...o,headers:h});
  if(r.status===401){window.location='/api/dashboard';return}
  if(!r.ok){var e=await r.json().catch(function(){return{}});throw new Error(e.detail||'Error')}
  return r.json();
}

function closeModal(){document.getElementById('modal').classList.remove('on')}
function openModal(html){document.getElementById('sheet-content').innerHTML=html;document.getElementById('modal').classList.add('on')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ========== ROUTER ==========
async function init(){
  if(!token){window.location='/api/dashboard';return}
  if(menuId){loadEditor()}else{loadList()}
}

// ========== MENU LIST ==========
async function loadList(){
  try{
    var menus=await api('/menus');
    templates=await api('/menu-templates');
    var html='<div class="list-header"><h1>My Menus</h1><p>Create and edit your digital menus</p></div>';
    html+='<button class="create-btn" onclick="showCreate()">+ Create New Menu</button>';
    if(menus.length===0){
      html+='<div style="text-align:center;padding:40px 20px;color:var(--text3)"><div style="font-size:36px;margin-bottom:8px">🍽</div><p>No menus yet. Tap the button above to create one.</p></div>';
    }
    var colors=['#6366f1','#22d3ee','#dc2626','#f59e0b','#f43f5e','#34d399','#a855f7','#16a34a'];
    menus.forEach(function(m,i){
      var catCount=(m.categories||[]).length;
      var itemCount=0;(m.categories||[]).forEach(function(c){itemCount+=(c.items||[]).length});
      html+='<div class="menu-card" onclick="window.location=\'/api/menu-editor?id='+m.id+'\'">';
      html+='<div class="menu-card-color" style="background:'+colors[i%colors.length]+'">'+(m.restaurant_name||m.name).charAt(0)+'</div>';
      html+='<div class="menu-card-info"><div class="menu-card-name">'+(m.restaurant_name||m.name)+'</div>';
      html+='<div class="menu-card-meta">'+catCount+' categories · '+itemCount+' items</div></div>';
      html+='<div class="menu-card-arrow">›</div></div>';
    });
    document.getElementById('app').innerHTML=html;
  }catch(e){document.getElementById('app').innerHTML='<p style="text-align:center;padding:40px;color:var(--red)">'+e.message+'</p>'}
}

// ========== CREATE MENU ==========
function showCreate(){
  var html='<div class="top"><button class="top-back" onclick="loadList()">←</button><div class="top-info"><div class="top-name">New Menu</div><div class="top-sub">Choose a template to start</div></div></div>';
  html+='<div style="padding:16px 12px"><div class="field"><label>Restaurant Name</label><input id="cr-restaurant" placeholder="Your Restaurant Name"></div>';
  html+='<div class="field"><label>Menu Name</label><input id="cr-name" placeholder="e.g. Lunch Menu, Full Menu"></div>';
  html+='<div class="field-row"><div class="field"><label>Currency</label><input id="cr-currency" value="$" style="width:60px"></div></div></div>';
  html+='<div style="padding:0 12px 8px"><label style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px">Choose Template</label></div>';
  html+='<div class="tpl-grid" id="tpl-grid"></div>';
  html+='<div style="padding:12px"><button class="btn-full btn-save" onclick="createMenu()">Create Menu</button></div>';
  document.getElementById('app').innerHTML=html;
  setTimeout(function(){document.getElementById('cr-restaurant').focus()},100);
  api('/menu-templates').then(function(tpls){
    templates=tpls;var g='';var sel='classic';
    tpls.forEach(function(t){
      g+='<div class="tpl-card'+(t.id===sel?' selected':'')+'" data-tid="'+t.id+'" onclick="selectTpl(this,\''+t.id+'\')">';
      g+='<div class="tpl-preview" style="background:'+t.preview_color+'"><span style="color:'+t.accent_color+'">'+t.name+'</span></div>';
      g+='<div class="tpl-name">'+t.name+'<div class="tpl-type">'+t.category+'</div></div></div>';
    });
    document.getElementById('tpl-grid').innerHTML=g;
  });
}

var selectedTpl='classic';
function selectTpl(el,tid){
  selectedTpl=tid;
  document.querySelectorAll('.tpl-card').forEach(function(c){c.classList.remove('selected')});
  el.classList.add('selected');
}

async function createMenu(){
  var name=document.getElementById('cr-name').value.trim()||'My Menu';
  var restaurant=document.getElementById('cr-restaurant').value.trim();
  var currency=document.getElementById('cr-currency').value||'$';
  if(!restaurant){alert('Enter restaurant name');return}
  try{
    var m=await api('/menus',{method:'POST',body:JSON.stringify({name:name,restaurant_name:restaurant,currency_symbol:currency,template_id:selectedTpl})});
    window.location='/api/menu-editor?id='+m.id;
  }catch(e){alert(e.message)}
}

// ========== EDITOR ==========
async function loadEditor(){
  try{
    menu=await api('/menus/'+menuId);
    currSym=menu.currency_symbol||'$';
    renderEditor();
  }catch(e){document.getElementById('app').innerHTML='<p style="text-align:center;padding:40px;color:var(--red)">'+e.message+'</p>'}
}

function renderEditor(){
  var html='<div class="top"><button class="top-back" onclick="window.location=\'/api/menu-editor\'">←</button>';
  html+='<div class="top-info"><div class="top-name">'+(menu.restaurant_name||menu.name)+'</div>';
  html+='<div class="top-sub">'+(menu.categories||[]).length+' categories</div></div>';
  html+='<button class="top-btn" onclick="window.open(\''+API+'/menus/'+menuId+'/render\',\'_blank\')">Preview</button></div>';
  html+='<div class="pad-bottom">';
  var cats=menu.categories||[];
  if(cats.length===0){
    html+='<div style="text-align:center;padding:50px 20px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">No categories yet</div><div style="font-size:13px;color:var(--text3);margin-bottom:16px">Tap + to add your first category</div></div>';
  }
  cats.forEach(function(cat){
    html+='<div class="cat"><div class="cat-head">';
    html+='<div class="cat-name" onclick="editCategory(\''+cat.id+'\')">'+cat.name+'</div>';
    html+='<button class="cat-btn" onclick="showAddItem(\''+cat.id+'\')">+ Item</button>';
    html+='<button class="cat-del" onclick="delCategory(\''+cat.id+'\')">×</button></div>';
    var items=cat.items||[];
    if(items.length===0){html+='<div class="empty">No items yet</div>'}
    items.forEach(function(it){
      html+='<div class="item'+(it.featured?' item-featured':'')+'">';
      html+=it.image?'<img class="item-img" src="'+it.image+'" onclick="editItem(\''+cat.id+'\',\''+it.id+'\')">':'<div class="item-placeholder" onclick="editItem(\''+cat.id+'\',\''+it.id+'\')">📷</div>';
      html+='<div class="item-info" onclick="editItem(\''+cat.id+'\',\''+it.id+'\')"><div class="item-name">'+it.name+'</div>';
      if(it.description)html+='<div class="item-desc">'+it.description+'</div>';
      html+='</div><div class="item-price" onclick="quickPrice(\''+cat.id+'\',\''+it.id+'\','+it.price+')">'+currSym+parseFloat(it.price||0).toFixed(2)+'</div>';
      html+='<button class="item-del" onclick="delItem(\''+cat.id+'\',\''+it.id+'\')">×</button></div>';
    });
    html+='</div>';
  });
  html+='<a class="preview-link" href="'+API+'/menus/'+menuId+'/render" target="_blank">View Full Screen Preview →</a>';
  html+='<a class="preview-link" href="https://www.canva.com/create/restaurant-menus/" target="_blank" style="color:var(--brand);border-color:rgba(99,102,241,.3)">Advanced Design in Canva →</a>';
  html+='</div><button class="fab" onclick="showAddCategory()">+</button>';
  document.getElementById('app').innerHTML=html;
}

// ========== QUICK PRICE ==========
function quickPrice(catId,itemId,val){
  openModal('<h3>Edit Price</h3><div class="field"><label>New Price ('+currSym+')</label><input type="number" step="0.01" id="qp" value="'+val+'" inputmode="decimal" style="font-size:32px;font-weight:900;text-align:center;color:var(--cyan)"></div><button class="btn-full btn-save" onclick="saveQP(\''+catId+'\',\''+itemId+'\')">Update Price</button>');
  setTimeout(function(){var e=document.getElementById('qp');e.focus();e.select()},100);
}
async function saveQP(c,i){var v=parseFloat(document.getElementById('qp').value);if(isNaN(v))return;try{await api('/menus/'+menuId+'/categories/'+c+'/items/'+i,{method:'PUT',body:JSON.stringify({price:v})});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}

// ========== CATEGORIES ==========
function showAddCategory(){
  openModal('<h3>New Category</h3><div class="field"><label>Name</label><input id="nc" placeholder="e.g. Appetizers, Drinks"></div><button class="btn-full btn-save" onclick="saveNewCat()">Add</button>');
  setTimeout(function(){document.getElementById('nc').focus()},100);
}
async function saveNewCat(){var n=document.getElementById('nc').value.trim();if(!n)return;try{await api('/menus/'+menuId+'/categories',{method:'POST',body:JSON.stringify({name:n})});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}

function editCategory(cid){
  var cat=(menu.categories||[]).find(function(c){return c.id===cid});if(!cat)return;
  openModal('<h3>Edit Category</h3><div class="field"><label>Name</label><input id="ec" value="'+cat.name+'"></div><button class="btn-full btn-save" onclick="saveCatEdit(\''+cid+'\')">Save</button><button class="btn-full btn-del" style="margin-top:8px" onclick="delCategory(\''+cid+'\')">Delete Category</button>');
}
async function saveCatEdit(cid){var n=document.getElementById('ec').value.trim();if(!n)return;try{await api('/menus/'+menuId+'/categories/'+cid,{method:'PUT',body:JSON.stringify({name:n})});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}
async function delCategory(cid){if(!confirm('Delete this category?'))return;try{await api('/menus/'+menuId+'/categories/'+cid,{method:'DELETE'});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}

// ========== ITEMS ==========
function showAddItem(cid){
  openModal('<h3>New Item</h3><div class="field"><label>Name</label><input id="in" placeholder="e.g. Caesar Salad"></div><div class="field-row"><div class="field"><label>Price ('+currSym+')</label><input id="ip" type="number" step="0.01" placeholder="12.99" inputmode="decimal"></div><div class="field" style="flex:0 0 auto"><label>Featured</label><div class="toggle-switch" id="if" onclick="this.classList.toggle(\'on\')"></div></div></div><div class="field"><label>Description</label><textarea id="id" placeholder="Short description..."></textarea></div><div class="field"><label>Photo</label><input type="file" accept="image/*" id="ii" onchange="prvImg(this)" style="font-size:13px;color:var(--text3)"><div id="ipr" style="margin-top:6px"></div><input type="hidden" id="iid"></div><button class="btn-full btn-save" onclick="saveNewItem(\''+cid+'\')">Add Item</button>');
  setTimeout(function(){document.getElementById('in').focus()},100);
}
function prvImg(el){if(!el.files||!el.files[0])return;var r=new FileReader();r.onload=function(e){document.getElementById('iid').value=e.target.result;document.getElementById('ipr').innerHTML='<img src="'+e.target.result+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover">'};r.readAsDataURL(el.files[0])}
async function saveNewItem(cid){var n=document.getElementById('in').value.trim(),p=parseFloat(document.getElementById('ip').value)||0,d=document.getElementById('id').value.trim(),img=document.getElementById('iid').value||'',f=document.getElementById('if').classList.contains('on');if(!n){alert('Enter name');return}try{await api('/menus/'+menuId+'/categories/'+cid+'/items',{method:'POST',body:JSON.stringify({name:n,price:p,description:d,image:img,featured:f})});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}

function editItem(cid,iid){
  var it=null;(menu.categories||[]).forEach(function(c){if(c.id===cid)(c.items||[]).forEach(function(i){if(i.id===iid)it=i})});if(!it)return;
  var img=it.image?'<img src="'+it.image+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover">':'';
  openModal('<h3>Edit Item</h3><div class="field"><label>Name</label><input id="in" value="'+it.name+'"></div><div class="field-row"><div class="field"><label>Price ('+currSym+')</label><input id="ip" type="number" step="0.01" value="'+it.price+'" inputmode="decimal"></div><div class="field" style="flex:0 0 auto"><label>Featured</label><div class="toggle-switch'+(it.featured?' on':'')+'" id="if" onclick="this.classList.toggle(\'on\')"></div></div></div><div class="field"><label>Description</label><textarea id="id">'+(it.description||'')+'</textarea></div><div class="field"><label>Photo</label><input type="file" accept="image/*" id="ii" onchange="prvImg(this)" style="font-size:13px;color:var(--text3)"><div id="ipr" style="margin-top:6px">'+img+'</div><input type="hidden" id="iid" value="'+(it.image||'')+'"></div><button class="btn-full btn-save" onclick="saveItemEdit(\''+cid+'\',\''+iid+'\')">Save</button><button class="btn-full btn-del" style="margin-top:8px" onclick="delItem(\''+cid+'\',\''+iid+'\')">Delete Item</button>');
}
async function saveItemEdit(cid,iid){var n=document.getElementById('in').value.trim(),p=parseFloat(document.getElementById('ip').value)||0,d=document.getElementById('id').value.trim(),img=document.getElementById('iid').value||'',f=document.getElementById('if').classList.contains('on');if(!n)return;try{await api('/menus/'+menuId+'/categories/'+cid+'/items/'+iid,{method:'PUT',body:JSON.stringify({name:n,price:p,description:d,image:img,featured:f})});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}
async function delItem(cid,iid){if(!confirm('Delete?'))return;try{await api('/menus/'+menuId+'/categories/'+cid+'/items/'+iid,{method:'DELETE'});closeModal();menu=await api('/menus/'+menuId);renderEditor()}catch(e){alert(e.message)}}

init();
</script>
</body>
</html>
