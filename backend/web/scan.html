<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediAd View — Publicate en esta pantalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#020617 0%,#0a0f1a 100%);color:#e2e8f0;min-height:100vh;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:24px 20px 60px}
.top{padding:14px 0 24px;display:flex;align-items:center;justify-content:center;gap:8px}
.top img{height:36px}
.top-tag{font-size:9px;color:#22d3ee;letter-spacing:2px;font-weight:800;padding:3px 10px;border:1px solid #22d3ee55;border-radius:12px}
.hero{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(20,184,166,.08));border:1px solid rgba(99,102,241,.25);border-radius:20px;overflow:hidden;margin-bottom:20px}
.hero .photo{width:100%;aspect-ratio:16/9;background:#0f172a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hero .photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero .photo-fallback{display:flex;flex-direction:column;align-items:center;gap:10px;color:#334155}
.hero .photo-fallback svg{opacity:.4}
.hero .photo-fallback span{font-size:11px;letter-spacing:1.5px;color:#475569;font-weight:600}
.pin{position:absolute;top:12px;left:12px;background:rgba(2,6,23,.85);backdrop-filter:blur(8px);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;color:#22d3ee;letter-spacing:.5px;display:flex;gap:5px;align-items:center}
.hero .body{padding:22px 22px 24px}
.eyebrow{font-size:10px;letter-spacing:2px;color:#6366f1;font-weight:800;margin-bottom:6px}
.hero h1{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.15;margin-bottom:6px}
.hero .loc{font-size:14px;color:#94a3b8;display:flex;align-items:center;gap:6px}
.hero .code-pill{margin-top:14px;font-family:'Courier New',monospace;font-size:13px;color:#22d3ee;letter-spacing:1px;padding:6px 12px;background:rgba(34,211,238,.08);border:1px dashed rgba(34,211,238,.4);border-radius:8px;display:inline-block}

.cta-card{background:#0f172a;border:1px solid #1e293b;border-radius:18px;padding:22px;margin-bottom:14px}
.cta-card h2{font-size:20px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.cta-card p{font-size:14px;color:#94a3b8;line-height:1.5;margin-bottom:16px}
.btn-primary{display:block;width:100%;padding:16px;text-align:center;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:12px;box-shadow:0 8px 24px rgba(99,102,241,.32);transition:transform .15s,box-shadow .2s;border:none;cursor:pointer;font-family:inherit}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(99,102,241,.42)}
.btn-secondary{display:block;width:100%;padding:14px;text-align:center;background:transparent;color:#e2e8f0;text-decoration:none;font-weight:700;font-size:14px;border-radius:12px;border:1.5px solid #1e293b;margin-top:10px;transition:border-color .2s}
.btn-secondary:hover{border-color:#6366f1;color:#fff}

.benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.benefit{background:rgba(15,23,42,.6);border:1px solid #1e293b;border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.benefit svg{flex-shrink:0;color:#10b981}
.benefit-txt{font-size:11px;color:#cbd5e1;font-weight:600;line-height:1.35}

.wide{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.25);border-radius:14px;padding:18px;margin-top:14px;text-align:center}
.wide-title{font-size:13px;color:#c7d2fe;font-weight:700;margin-bottom:8px}
.wide p{font-size:13px;color:#94a3b8;line-height:1.55}

.foot{margin-top:32px;font-size:11px;color:#475569;text-align:center;line-height:1.6}
.foot a{color:#64748b;text-decoration:none;border-bottom:1px dotted #334155}

.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:14px;border-radius:12px;margin-bottom:16px;font-size:13px;text-align:center}

@media(max-width:420px){
  .wrap{padding:20px 16px 40px}
  .hero h1{font-size:24px}
  .cta-card h2{font-size:18px}
  .benefits{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <img src="/api/web/logo-new.png" alt="MediAd View">
    <span class="top-tag">DIGITAL SIGNAGE</span>
  </div>

  <div id="err-block"></div>
  <div id="loading" style="text-align:center;padding:60px 20px;color:#64748b;font-size:14px">Cargando pantalla…</div>
  <div id="content" style="display:none"></div>

  <div class="foot">
    Escaneaste este código junto a una pantalla MediAd View.<br>
    ¿No tienes cámara? Ingresa el código en <a href="/">mediadview.com</a>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var screenId = params.get('id');
  var codeParam = params.get('code') || params.get('c');
  var errBlock = document.getElementById('err-block');
  var loading = document.getElementById('loading');
  var content = document.getElementById('content');

  function fail(msg){
    loading.style.display = 'none';
    errBlock.innerHTML = '<div class="err">'+msg+'</div>';
    content.style.display = 'block';
    content.innerHTML = '<div class="cta-card"><h2>¿Buscas una pantalla en particular?</h2><p>Ingresa el código impreso junto al QR (por ejemplo: <b>MV-KD6K-TWTU</b>).</p><a href="/marketplace" class="btn-primary">Ver todas las pantallas disponibles</a></div>';
  }

  function render(s){
    loading.style.display = 'none';
    content.style.display = 'block';
    var photo = s.photo_base64;
    var photoHtml = photo
      ? '<img src="'+(photo.startsWith('data:')?photo:'data:image/jpeg;base64,'+photo)+'" alt="'+(s.name||'')+'">'
      : '<div class="photo-fallback"><svg width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg><span>DIGITAL SCREEN</span></div>';
    var loc = s.location || {};
    var city = [loc.city, loc.state].filter(Boolean).join(', ') || 'Ubicación disponible al crear cuenta';
    var qs = encodeURIComponent(s.id||'') + (s.pairing_code ? '&code='+encodeURIComponent(s.pairing_code) : '');

    content.innerHTML =
      '<div class="hero">'
      + '<div class="photo">'
        + '<span class="pin">'
          + '<svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>'
          + (loc.city||'MediAd View')
        + '</span>'
        + photoHtml
      + '</div>'
      + '<div class="body">'
        + '<div class="eyebrow">PANTALLA IDENTIFICADA</div>'
        + '<h1>'+(s.name||'Pantalla MediAd View')+'</h1>'
        + '<div class="loc">'
          + '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
          + city
        + '</div>'
        + (s.pairing_code ? '<div class="code-pill">'+s.pairing_code+'</div>' : '')
      + '</div>'
      + '</div>'

      + '<div class="cta-card">'
        + '<h2>Publicate en esta pantalla</h2>'
        + '<p>Perro perdido, oferta de trabajo, promoción de tu negocio, propuesta de matrimonio… <b>anuncia lo que quieras</b> por 1, 3, 6 o 12 meses. Crea tu cuenta en 30 segundos.</p>'
        + '<a href="/signup?screen='+qs+'" class="btn-primary">Crea tu cuenta gratis y ver precios →</a>'
        + '<a href="/login?screen='+qs+'" class="btn-secondary">Ya tengo cuenta — Iniciar sesión</a>'

        + '<div class="benefits">'
          + '<div class="benefit"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><div class="benefit-txt">Sin costos ocultos</div></div>'
          + '<div class="benefit"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><div class="benefit-txt">Descuento hasta 30%</div></div>'
          + '<div class="benefit"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><div class="benefit-txt">Múltiples pantallas</div></div>'
          + '<div class="benefit"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><div class="benefit-txt">Sube foto o video</div></div>'
        + '</div>'
      + '</div>'

      + '<div class="wide">'
        + '<div class="wide-title">🌎 ¿Quieres más alcance?</div>'
        + '<p>Al crear tu cuenta podrás elegir <b>múltiples pantallas</b> en distintas localidades. Mientras más pantallas, más gente ve tu anuncio.</p>'
      + '</div>';
  }

  function loadById(id){
    fetch('/api/public/screens/' + encodeURIComponent(id).replace(/%2F/g,'/'))
      .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
      .then(render)
      .catch(function(){ fail('Esta pantalla no está disponible. Verifica el código.'); });
  }

  function loadByCode(code){
    fetch('/api/public/screens/by-code/' + encodeURIComponent(code))
      .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
      .then(render)
      .catch(function(){ fail('Código de pantalla no encontrado. Verifica que sea el correcto (formato MV-XXXX-XXXX).'); });
  }

  // Prefer explicit code, then id. If neither, use the public screens endpoint (uses non-auth path).
  if (codeParam) loadByCode(codeParam);
  else if (screenId) {
    // Try public screen id lookup; the endpoint below is unauthenticated
    fetch('/api/public/screens').then(function(r){ return r.json(); }).then(function(list){
      var m = list.find(function(x){ return x.id === screenId; });
      if (m) render(m);
      else fail('Esta pantalla no está disponible. Verifica el código.');
    }).catch(function(){ fail('No se pudo cargar la pantalla. Intenta más tarde.'); });
  } else {
    fail('No se especificó ninguna pantalla en el enlace.');
  }
})();
</script>
</body>
</html>
