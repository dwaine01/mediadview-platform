<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediAd View Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e2e8f0;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{margin-bottom:20px}
.tagline{font-size:18px;color:#22d3ee;letter-spacing:3px;font-weight:600;margin-bottom:50px}
.code-box{display:flex;gap:14px;margin-bottom:30px}
.code-char{width:72px;height:92px;background:#0a0f1a;border:2px solid #22d3ee;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#22d3ee}
.status{font-size:16px;color:#64748b;margin-bottom:10px}
.status.ok{color:#34d399}
.steps{margin-top:30px;text-align:left;max-width:480px}
.step{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:15px;color:#94a3b8}
.step .num{width:28px;height:28px;border-radius:50%;background:#0a0f1a;border:1px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#22d3ee;flex-shrink:0}
.spinner{width:36px;height:36px;border:3px solid #1e293b;border-top-color:#22d3ee;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
video::-webkit-media-controls{display:none!important}
video::-webkit-media-controls-overlay-play-button{display:none!important}
#player{display:none;width:100%;height:100vh;background:#000;position:fixed;top:0;left:0}
#player img{width:100%;height:100%;object-fit:contain}
.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#000}
.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes zoomIn{from{transform:scale(1.15);opacity:0}to{transform:scale(1);opacity:1}}
.anim-fade{animation:fadeIn .8s ease}
.anim-slide{animation:slideIn .6s ease}
.anim-zoom{animation:zoomIn .8s ease}
</style>
</head>
<body>

<div id="activate-screen">
  <img src="/api/web/logo.png" class="logo" style="width:280px" alt="MediAd View">
  <p class="tagline">DIGITAL SIGNAGE PLATFORM</p>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">Registering device...</p>
  <div class="code-box" id="code-box" style="display:none"></div>
  <div class="steps" id="steps" style="display:none">
    <div class="step"><div class="num">1</div>Open MediAd View Admin Panel</div>
    <div class="step"><div class="num">2</div>Go to Devices tab</div>
    <div class="step"><div class="num">3</div>Enter the code and select a screen</div>
    <div class="step"><div class="num">4</div>Content plays automatically</div>
  </div>
</div>

<div id="player"></div>

<script>
// ===== CONFIG =====
var AB = location.origin;
var deviceId = localStorage.getItem('mv_did');
var code = localStorage.getItem('mv_code');
var screenId = localStorage.getItem('mv_sid');
var polling = null;
var playIndex = 0;
var playlist = [];
var playTimer = null;
var mediaCache = {};
var rebootTime = '03:00';

// ===== STARTUP =====
async function start() {
  if (deviceId && screenId) { checkAndPlay(); return; }
  if (deviceId) { showCode(code); pollActivation(); return; }
  register();
}

// ===== REGISTER DEVICE =====
async function register() {
  document.getElementById('status').textContent = 'Registering device...';
  try {
    var r = await fetch(AB + '/api/devices/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ device_name: 'MediAd View TV Player', device_model: navigator.userAgent.substring(0, 50), os_version: navigator.platform, app_version: '1.1.0', resolution: screen.width + 'x' + screen.height, platform: 'smart_tv' })
    });
    var d = await r.json();
    deviceId = d.device_id; code = d.activation_code;
    localStorage.setItem('mv_did', deviceId);
    localStorage.setItem('mv_code', code);
    showCode(code); pollActivation();
  } catch (e) {
    document.getElementById('status').textContent = 'Cannot connect. Retrying...';
    setTimeout(register, 5000);
  }
}

// ===== SHOW ACTIVATION CODE =====
function showCode(c) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('code-box').style.display = 'flex';
  document.getElementById('code-box').innerHTML = c.split('').map(function(ch) { return '<div class="code-char">' + ch + '</div>'; }).join('');
  document.getElementById('status').textContent = 'Enter this code in the Admin Panel';
  document.getElementById('steps').style.display = 'block';
}

// ===== POLL FOR ACTIVATION =====
function pollActivation() {
  polling = setInterval(async function() {
    try {
      var r = await fetch(AB + '/api/devices/' + deviceId + '/check');
      var d = await r.json();
      if (d.status === 'active' && d.screen_id) {
        clearInterval(polling);
        screenId = d.screen_id;
        localStorage.setItem('mv_sid', screenId);
        document.getElementById('status').textContent = 'Activated! Loading...';
        document.getElementById('status').className = 'status ok';
        setTimeout(checkAndPlay, 2000);
      }
    } catch (e) {}
  }, 5000);
}

// ===== START PLAYING =====
async function checkAndPlay() {
  document.getElementById('activate-screen').style.display = 'none';
  document.getElementById('player').style.display = 'block';
  fetchPlaylist();
  setInterval(fetchPlaylist, 60000);
  setInterval(sendHeartbeat, 30000);
  setInterval(checkNightlyReboot, 60000);
}

// ===== FETCH PLAYLIST =====
async function fetchPlaylist() {
  try {
    var r = await fetch(AB + '/api/devices/' + deviceId + '/playlist');
    var d = await r.json();
    var items = d.items || [];
    if (d.config && d.config.reboot_time) rebootTime = d.config.reboot_time;

    if (items.length > 0) {
      var nw = items.map(function(i) { return i.media_id; }).join(',');
      var ol = playlist.map(function(i) { return i.media_id; }).join(',');
      if (nw !== ol) {
        playlist = items;
        playIndex = 0;
        playItem();
        preDownloadContent();
      }
    } else {
      document.getElementById('player').innerHTML = '<div class="fallback"><img src="/api/web/logo.png" style="width:200px;margin-bottom:16px"><p style="font-size:18px;color:#22d3ee;letter-spacing:2px">DIGITAL SIGNAGE PLATFORM</p><p style="font-size:16px;color:#475569;margin-top:20px">No campaigns scheduled</p></div>';
    }
  } catch (e) {
    if (playlist.length === 0) {
      document.getElementById('player').innerHTML = '<div class="fallback"><img src="/api/web/logo.png" style="width:200px;margin-bottom:16px"><p style="font-size:16px;color:#475569">Offline - Retrying...</p></div>';
    }
  }
}

// ===== PLAY ITEM =====
function playItem() {
  if (playlist.length === 0) return;
  if (playIndex >= playlist.length) playIndex = 0;
  var item = playlist[playIndex];
  var url = getCachedUrl(item);
  var isImg = item.content_type && item.content_type.indexOf('image') >= 0;
  clearTimeout(playTimer);

  // Handle widgets
  if (item.content_type === 'widget') {
    var widgetUrl = AB + item.download_url;
    document.getElementById('player').innerHTML = '<iframe src="' + widgetUrl + '" style="width:100vw;height:100vh;border:none;background:#000" allowfullscreen></iframe>';
    logPlay(item);
    playTimer = setTimeout(nextItem, (item.duration || 30) * 1000);
    return;
  }

  var rot = item.rotation || 0;
  var rotStyle = rot ? 'transform:rotate(' + rot + 'deg);' : '';
  if (rot === 90 || rot === 270) rotStyle += 'width:100vh;height:100vw;position:absolute;top:50%;left:50%;margin-top:-50vw;margin-left:-50vh;object-fit:contain;';
  else rotStyle += 'width:100%;height:100%;object-fit:contain;';
  
  if (isImg) {
    var anim = item.animation || 'fade';
    var animClass = anim !== 'none' ? 'anim-' + anim : '';
    document.getElementById('player').innerHTML = '<div class="' + animClass + '" style="width:100vw;height:100vh;background:#000;overflow:hidden;position:relative"><img src="' + url + '" style="' + rotStyle + '"></div>';
  } else {
    // Video: use direct video element with muted+playsinline
    document.getElementById('player').innerHTML = '<video id="vid" muted playsinline preload="auto" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" style="' + rotStyle + 'background:#000" src="' + url + '"></video>';
    var v = document.getElementById('vid');
    if (v) {
      v.onended = function() { nextItem(); };
      v.onerror = function() { nextItem(); };
      v.play().catch(function() { v.muted = true; v.play().catch(function() { nextItem(); }); });
    }
  }

  logPlay(item);
  playTimer = setTimeout(nextItem, (item.duration || 15) * 1000);
}

function nextItem() { playIndex++; if (playIndex >= playlist.length) playIndex = 0; playItem(); }

// ===== HEARTBEAT + REMOTE COMMANDS =====
async function sendHeartbeat() {
  try {
    var r = await fetch(AB + '/api/devices/' + deviceId + '/heartbeat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ status: 'online', app_version: '2.0.0', cached_media_count: Object.keys(mediaCache).length })
    });
    var d = await r.json();
    if (d.action === 'wait') {
      localStorage.removeItem('mv_sid'); screenId = null;
      document.getElementById('player').style.display = 'none';
      document.getElementById('activate-screen').style.display = 'flex';
      showCode(code); pollActivation();
    }
    if (d.command) {
      if (d.command === 'restart' || d.command === 'reload') { window.location.reload(true); }
      if (d.command === 'clear_cache') { mediaCache = {}; localStorage.clear(); window.location.reload(true); }
      if (d.command === 'sleep') { enterSleepMode(); }
      if (d.command === 'wake') { exitSleepMode(); }
    }
    // Check power schedule
    if (d.power_schedule && d.power_schedule.enabled) {
      checkPowerSchedule(d.power_schedule);
    }
  } catch (e) {}
}

// ===== POWER SCHEDULE =====
var isSleeping = false;
function enterSleepMode() {
  if (isSleeping) return;
  isSleeping = true;
  document.getElementById('player').innerHTML = '<div style="width:100vw;height:100vh;background:#000"></div>';
}
function exitSleepMode() {
  if (!isSleeping) return;
  isSleeping = false;
  fetchPlaylist();
}
function checkPowerSchedule(schedule) {
  var now = new Date();
  var days = ['sun','mon','tue','wed','thu','fri','sat'];
  var today = days[now.getDay()];
  if (schedule.days && schedule.days.indexOf(today) === -1) { enterSleepMode(); return; }
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var currentTime = h + ':' + m;
  if (currentTime >= schedule.power_on && currentTime < schedule.power_off) {
    if (isSleeping) exitSleepMode();
  } else {
    if (!isSleeping) enterSleepMode();
  }
}

// ===== PROOF OF PLAY =====
async function logPlay(item) {
  try {
    await fetch(AB + '/api/playlog?media_id=' + item.media_id + '&device_id=' + deviceId + '&screen_id=' + (screenId || '') + '&duration=' + (item.duration || 15), { method: 'POST' });
  } catch (e) {}
}

// ===== NIGHTLY REBOOT =====
function checkNightlyReboot() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  if (h + ':' + m === rebootTime) {
    mediaCache = {};
    window.location.reload(true);
  }
}

// ===== CONTENT PRE-DOWNLOAD =====
async function preDownloadContent() {
  for (var i = 0; i < playlist.length; i++) {
    var item = playlist[i];
    if (mediaCache[item.media_id]) continue;
    try {
      var url = AB + item.download_url;
      var response = await fetch(url);
      var blob = await response.blob();
      mediaCache[item.media_id] = URL.createObjectURL(blob);
    } catch (e) {}
  }
}

function getCachedUrl(item) {
  return mediaCache[item.media_id] || (AB + item.download_url);
}

// ===== START =====
start();
</script>
</body>
</html>
