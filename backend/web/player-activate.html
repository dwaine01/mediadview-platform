<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediAd View Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e2e8f0;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{margin-bottom:20px}
.tagline{font-size:18px;color:#22d3ee;letter-spacing:3px;font-weight:600;margin-bottom:50px}
.code-box{display:flex;gap:14px;margin-bottom:30px}
.code-char{width:72px;height:92px;background:#0a0f1a;border:2px solid #22d3ee;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#22d3ee}
.status{font-size:16px;color:#64748b;margin-bottom:10px}
.status.ok{color:#34d399}
.steps{margin-top:30px;text-align:left;max-width:480px}
.step{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:15px;color:#94a3b8}
.step .num{width:28px;height:28px;border-radius:50%;background:#0a0f1a;border:1px solid #22d3ee;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#22d3ee;flex-shrink:0}
.spinner{width:36px;height:36px;border:3px solid #1e293b;border-top-color:#22d3ee;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
video::-webkit-media-controls{display:none!important}
video::-webkit-media-controls-overlay-play-button{display:none!important}
/* ── Player: two slots for double-buffer, no loading flash ── */
#player{display:none;width:100vw;height:100vh;background:#000;position:fixed;top:0;left:0;overflow:hidden}
.slot{position:absolute;inset:0;background:#000;transition:opacity 0.4s ease}
.slot.active{z-index:2;opacity:1}
.slot.hidden{z-index:1;opacity:0;pointer-events:none}
.slot img,.slot video{width:100%;height:100%;object-fit:cover;display:block}/* default COVER — overridden inline by resolveObjectFit() */
/* fallback splash — shown only when there is genuinely no content */
.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#09090f}
.hidden-el{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes zoomIn{from{transform:scale(1.15);opacity:0}to{transform:scale(1);opacity:1}}
.anim-fade{animation:fadeIn 0.6s ease}
.anim-slide{animation:slideIn 0.5s ease}
.anim-zoom{animation:zoomIn 0.6s ease}
.anim-slide{animation:slideIn .6s ease}
.anim-zoom{animation:zoomIn .8s ease}
</style>
</head>
<body>

<div id="activate-screen">
  <img src="/api/web/logo.png" class="logo" style="width:280px" alt="MediAd View">
  <p class="tagline">DIGITAL SIGNAGE PLATFORM</p>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">Registering device...</p>
  <div class="code-box" id="code-box" style="display:none"></div>
  <div class="steps" id="steps" style="display:none">
    <div class="step"><div class="num">1</div>Open MediAd View Admin Panel</div>
    <div class="step"><div class="num">2</div>Go to Devices tab</div>
    <div class="step"><div class="num">3</div>Enter the code and select a screen</div>
    <div class="step"><div class="num">4</div>Content plays automatically</div>
  </div>
</div>

<div id="player">
  <!-- Double-buffer slots: slot-a is active, slot-b preloads next content -->
  <div id="slot-a" class="slot active"></div>
  <div id="slot-b" class="slot hidden"></div>
</div>

<script>
// P0-A2: HTML escape helper — used on ALL innerHTML paths that inject
// server-controlled data (widget URLs, media URLs, codes) to prevent XSS.
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ===== CONFIG =====
var AB = location.origin;
var deviceId = localStorage.getItem('mv_did');
var code = localStorage.getItem('mv_code');
var screenId = localStorage.getItem('mv_sid');
var polling = null;
var playIndex = 0;
var playlist = [];
var playTimer = null;
var mediaCache = {};
var rebootTime = '03:00';

// ===== STARTUP =====
async function start() {
  if (deviceId && screenId) { checkAndPlay(); return; }
  if (deviceId) { showCode(code); pollActivation(); return; }
  register();
}

// ===== REGISTER DEVICE =====
async function register() {
  document.getElementById('status').textContent = 'Registering device...';
  try {
    var r = await fetch(AB + '/api/devices/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ device_name: 'MediAd View TV Player', device_model: navigator.userAgent.substring(0, 50), os_version: navigator.platform, app_version: '1.1.0', resolution: screen.width + 'x' + screen.height, platform: 'smart_tv' })
    });
    var d = await r.json();
    deviceId = d.device_id; code = d.activation_code;
    localStorage.setItem('mv_did', deviceId);
    localStorage.setItem('mv_code', code);
    showCode(code); pollActivation();
  } catch (e) {
    document.getElementById('status').textContent = 'Cannot connect. Retrying...';
    setTimeout(register, 5000);
  }
}

// ===== SHOW ACTIVATION CODE =====
function showCode(c) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('code-box').style.display = 'flex';
  document.getElementById('code-box').innerHTML = String(c==null?'':c).split('').map(function(ch) { return '<div class="code-char">' + esc(ch) + '</div>'; }).join('');
  document.getElementById('status').textContent = 'Enter this code in the Admin Panel';
  document.getElementById('steps').style.display = 'block';
}

// ===== POLL FOR ACTIVATION =====
function pollActivation() {
  polling = setInterval(async function() {
    try {
      var r = await fetch(AB + '/api/devices/' + deviceId + '/check');
      var d = await r.json();
      if (d.status === 'active' && d.screen_id) {
        clearInterval(polling);
        screenId = d.screen_id;
        localStorage.setItem('mv_sid', screenId);
        document.getElementById('status').textContent = 'Activated! Loading...';
        document.getElementById('status').className = 'status ok';
        setTimeout(checkAndPlay, 2000);
      }
    } catch (e) {}
  }, 5000);
}

// ===== START PLAYING =====
async function checkAndPlay() {
  document.getElementById('activate-screen').style.display = 'none';
  document.getElementById('player').style.display = 'block';
  fetchPlaylist();
  setInterval(fetchPlaylist, 60000);
  setInterval(sendHeartbeat, 30000);
  setInterval(checkNightlyReboot, 60000);
}

// ===== FETCH PLAYLIST =====
async function fetchPlaylist() {
  try {
    var r = await fetch(AB + '/api/devices/' + deviceId + '/playlist');
    var d = await r.json();
    var items = d.items || [];
    if (d.config && d.config.reboot_time) rebootTime = d.config.reboot_time;

    if (items.length > 0) {
      var nw = items.map(function(i) { return i.media_id; }).join(',');
      var ol = playlist.map(function(i) { return i.media_id; }).join(',');
      if (nw !== ol) {
        playlist = items;
        playIndex = 0;
        playItem();
        preDownloadContent();
      }
    } else {
      showSplash('No campaigns scheduled');
    }
  } catch (e) {
    if (playlist.length === 0) {
      showSplash('Offline — Retrying...');
    }
    // If we already have content, keep playing silently (seamless offline)
  }
}

// ── Splash: shown only when genuinely no content — no "Loading..." text ──
function showSplash(msg) {
  var p = document.getElementById('player');
  var a = document.getElementById('slot-a');
  var b = document.getElementById('slot-b');
  a.innerHTML = '<div class="fallback"><div style="width:80px;height:80px;border-radius:20px;background:#1e1b4b;border:2px solid #312e81;display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:28px;font-weight:900;color:#6366f1">MV</div><p style="font-size:36px;font-weight:800;color:#e2e8f0">MediaView</p><p style="font-size:16px;color:#6366f1;margin-top:4px">Digital Signage</p><div style="width:80px;height:2px;background:#1e293b;margin:24px 0"></div><p style="font-size:15px;color:#64748b">' + esc(msg) + '</p></div>';
  b.innerHTML = '';
  a.className = 'slot active';
  b.className = 'slot hidden';
  p.style.display = 'block';
}

// ===== PLAY ITEM — double-buffer, no "Loading content..." flash =====
// activeSlot: which slot is currently visible ('a' or 'b')
var activeSlot = 'a';

function resolveObjectFit(item) {
  var m = (item.display_mode || '').toLowerCase();
  if (m === 'contain') return 'contain';
  if (m === 'stretch') return 'fill';
  return 'cover'; // default COVER for all media
}

function playItem() {
  if (playlist.length === 0) return;
  if (playIndex >= playlist.length) playIndex = 0;
  var item = playlist[playIndex];
  var url = getCachedUrl(item);
  var isImg = item.content_type && item.content_type.indexOf('image') >= 0;
  var objectFit = resolveObjectFit(item);
  clearTimeout(playTimer);

  // Determine next slot (the one that is currently hidden / background)
  var nextSlot = activeSlot === 'a' ? 'b' : 'a';
  var nextEl = document.getElementById('slot-' + nextSlot);
  var activeEl = document.getElementById('slot-' + activeSlot);

  // Helper: swap slots once content is ready — no loading flash
  function commitSwap() {
    nextEl.className = 'slot active';
    activeEl.className = 'slot hidden';
    // Clean up old slot after transition
    setTimeout(function() { activeEl.innerHTML = ''; }, 500);
    activeSlot = nextSlot;
  }

  // Handle widgets — show immediately (iframe loads its own content)
  if (item.content_type === 'widget') {
    nextEl.innerHTML = '<iframe src="' + esc(AB + item.download_url) + '" style="width:100%;height:100%;border:none;background:#000" allowfullscreen></iframe>';
    commitSwap();
    logPlay(item);
    playTimer = setTimeout(nextItem, (item.duration || 30) * 1000);
    return;
  }

  var rot = item.rotation || 0;
  var transform = rot ? 'transform:rotate(' + rot + 'deg);' : '';
  var baseStyle = 'width:100%;height:100%;object-fit:' + objectFit + ';display:block;background:#000;' + transform;
  if (rot === 90 || rot === 270) {
    baseStyle = 'width:100vh;height:100vw;object-fit:' + objectFit + ';position:absolute;top:50%;left:50%;margin-top:-50vw;margin-left:-50vh;' + transform;
  }

  if (isImg) {
    // Preload image in memory — only swap DOM when fully loaded (no flash)
    var preload = new window.Image();
    preload.onload = function() {
      var anim = item.animation || 'fade';
      var animClass = anim !== 'none' ? 'anim-' + esc(anim) : '';
      nextEl.innerHTML = '<div class="' + animClass + '" style="position:absolute;inset:0;overflow:hidden"><img src="' + esc(url) + '" style="' + baseStyle + '"></div>';
      commitSwap();
    };
    preload.onerror = function() {
      // Skip to next without showing error to public
      setTimeout(nextItem, 300);
      return;
    };
    preload.src = url;
  } else {
    // Preload video — swap as soon as enough data is buffered (canplaythrough)
    var vid = document.createElement('video');
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = 'auto';
    vid.style.cssText = baseStyle;
    vid.src = url;
    vid.oncanplaythrough = function() {
      if (nextEl.querySelector('video') !== vid) return; // stale
      commitSwap();
      vid.play().catch(function() { vid.muted = true; vid.play().catch(function() {}); });
    };
    vid.onended = function() { nextItem(); };
    vid.onerror = function() { setTimeout(nextItem, 300); };
    nextEl.innerHTML = '';
    nextEl.appendChild(vid);
    // Fallback: if canplaythrough doesn't fire within 2s, commit anyway
    setTimeout(function() {
      if (activeSlot !== nextSlot) commitSwap();
    }, 2000);
    vid.load();
  }

  logPlay(item);
  playTimer = setTimeout(nextItem, (item.duration || 15) * 1000);
}

function nextItem() { playIndex++; if (playIndex >= playlist.length) playIndex = 0; playItem(); }

// ===== HEARTBEAT + REMOTE COMMANDS =====
async function sendHeartbeat() {
  try {
    var r = await fetch(AB + '/api/devices/' + deviceId + '/heartbeat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ status: 'online', app_version: '2.0.0', cached_media_count: Object.keys(mediaCache).length })
    });
    var d = await r.json();
    if (d.action === 'wait') {
      localStorage.removeItem('mv_sid'); screenId = null;
      document.getElementById('player').style.display = 'none';
      document.getElementById('activate-screen').style.display = 'flex';
      showCode(code); pollActivation();
    }
    if (d.command) {
      if (d.command === 'restart' || d.command === 'reload') { window.location.reload(true); }
      if (d.command === 'clear_cache') { mediaCache = {}; localStorage.clear(); window.location.reload(true); }
      if (d.command === 'sleep') { enterSleepMode(); }
      if (d.command === 'wake') { exitSleepMode(); }
    }
    // Check power schedule
    if (d.power_schedule && d.power_schedule.enabled) {
      checkPowerSchedule(d.power_schedule);
    }
  } catch (e) {}
}

// ===== POWER SCHEDULE =====
var isSleeping = false;
function enterSleepMode() {
  if (isSleeping) return;
  isSleeping = true;
  // Black screen for sleep — slots cleared, no debug text
  document.getElementById('slot-a').innerHTML = '';
  document.getElementById('slot-b').innerHTML = '';
}
function exitSleepMode() {
  if (!isSleeping) return;
  isSleeping = false;
  fetchPlaylist();
}
function checkPowerSchedule(schedule) {
  var now = new Date();
  var days = ['sun','mon','tue','wed','thu','fri','sat'];
  var today = days[now.getDay()];
  if (schedule.days && schedule.days.indexOf(today) === -1) { enterSleepMode(); return; }
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  var currentTime = h + ':' + m;
  if (currentTime >= schedule.power_on && currentTime < schedule.power_off) {
    if (isSleeping) exitSleepMode();
  } else {
    if (!isSleeping) enterSleepMode();
  }
}

// ===== PROOF OF PLAY =====
async function logPlay(item) {
  try {
    await fetch(AB + '/api/playlog?media_id=' + item.media_id + '&device_id=' + deviceId + '&screen_id=' + (screenId || '') + '&duration=' + (item.duration || 15), { method: 'POST' });
  } catch (e) {}
}

// ===== NIGHTLY REBOOT =====
function checkNightlyReboot() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  if (h + ':' + m === rebootTime) {
    mediaCache = {};
    window.location.reload(true);
  }
}

// ===== CONTENT PRE-DOWNLOAD =====
async function preDownloadContent() {
  for (var i = 0; i < playlist.length; i++) {
    var item = playlist[i];
    if (mediaCache[item.media_id]) continue;
    try {
      var url = AB + item.download_url;
      var response = await fetch(url);
      var blob = await response.blob();
      mediaCache[item.media_id] = URL.createObjectURL(blob);
    } catch (e) {}
  }
}

function getCachedUrl(item) {
  return mediaCache[item.media_id] || (AB + item.download_url);
}

// ===== START =====
start();
</script>
</body>
</html>
