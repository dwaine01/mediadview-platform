<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediAd View — Order</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { font-family:'Inter',sans-serif; background:#020617; color:#e2e8f0; min-height:100vh }
.wrap { max-width:720px; margin:0 auto; padding:40px 24px }
.card { background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:32px; box-shadow:0 8px 30px rgba(0,0,0,.3) }
h1 { font-size:24px; font-weight:900; letter-spacing:-.5px }
.sub { color:#64748b; margin-bottom:24px; font-size:13px }
.row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #1e293b; font-size:14px }
.row:last-child { border-bottom:none }
.lbl { color:#64748b }
.val { color:#e2e8f0; font-weight:600 }
.badge { display:inline-block; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px }
.b-paid { background:rgba(16,185,129,.12); color:#34d399 }
.b-review { background:rgba(251,191,36,.12); color:#fbbf24 }
.b-approved { background:rgba(99,102,241,.12); color:#a5b4fc }
.b-playing { background:rgba(34,211,238,.12); color:#22d3ee }
.b-completed { background:rgba(148,163,184,.12); color:#94a3b8 }
.b-processing, .b-awaiting { background:rgba(148,163,184,.12); color:#94a3b8 }
.b-failed, .b-cancelled, .b-rejected { background:rgba(239,68,68,.12); color:#f87171 }
.b-refunded, .b-refund { background:rgba(217,70,239,.12); color:#e879f9 }
.err { padding:24px; text-align:center; color:#f87171 }
.total { font-size:26px; font-weight:900; color:#22d3ee }
.hint { font-size:12px; color:#64748b; margin-top:20px; padding:14px; background:rgba(99,102,241,.04); border:1px solid rgba(99,102,241,.14); border-radius:10px }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <div style="text-align:center; padding:32px; color:#64748b">Loading…</div>
  </div>
</div>
<script>
const STATUS_LABELS = {
  awaiting_payment:   ['Awaiting Payment',       'b-awaiting'],
  payment_processing: ['Processing Payment',      'b-processing'],
  payment_failed:     ['Payment Failed',          'b-failed'],
  paid:               ['Paid — Queued for Review','b-paid'],
  pending_review:     ['Pending Admin Review',    'b-review'],
  changes_requested:  ['Changes Requested',       'b-review'],
  approved:           ['Approved',                'b-approved'],
  scheduled:          ['Scheduled',               'b-approved'],
  playing:            ['Live on Screen',          'b-playing'],
  completed:          ['Completed',               'b-completed'],
  cancelled:          ['Cancelled',               'b-cancelled'],
  rejected:           ['Rejected',                'b-rejected'],
  refund_pending:     ['Refund Pending',          'b-refund'],
  refunded:           ['Refunded',                'b-refunded'],
  disputed:           ['Disputed',                'b-failed'],
};

function fmt(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('en-US', {
      year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
    });
  } catch { return String(iso); }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function load() {
  const token = location.pathname.replace(/^\/o\//,'').replace(/^\/api\/o\//,'');
  if (!token || token.indexOf('.') === -1) {
    document.getElementById('app').innerHTML = '<div class="err">Invalid link.</div>';
    return;
  }
  try {
    const r = await fetch('/api/orders/' + encodeURIComponent(token));
    if (r.status === 404) {
      document.getElementById('app').innerHTML = '<div class="err">This order link is invalid or has expired.</div>';
      return;
    }
    if (!r.ok) throw new Error('load failed');
    const o = await r.json();
    render(o);
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="err">Failed to load order.</div>';
  }
}

function render(o) {
  const [lbl, cls] = STATUS_LABELS[o.status] || [o.status, 'b-processing'];
  const total = (o.amount_cents / 100).toFixed(2);
  const html = `
    <h1>Order ${escapeHtml(o.order_number)}</h1>
    <p class="sub">Thanks — here is your order status. This link is valid for 30 days.</p>
    <div class="row">
      <span class="lbl">Status</span>
      <span class="val"><span class="badge ${cls}">${escapeHtml(lbl)}</span></span>
    </div>
    <div class="row">
      <span class="lbl">Screen</span>
      <span class="val">${escapeHtml(o.screen_name)}</span>
    </div>
    <div class="row">
      <span class="lbl">Hours</span>
      <span class="val">${o.hours}</span>
    </div>
    <div class="row">
      <span class="lbl">Created</span>
      <span class="val">${fmt(o.created_at)}</span>
    </div>
    <div class="row">
      <span class="lbl">Paid at</span>
      <span class="val">${fmt(o.paid_at)}</span>
    </div>
    <div class="row">
      <span class="lbl">Total</span>
      <span class="total">$${total} <small style="font-size:11px; color:#475569">${o.currency.toUpperCase()}</small></span>
    </div>
    <div class="hint">
      ${o.status === 'pending_review' || o.status === 'paid'
        ? 'Your creative is in the admin review queue. We\\'ll notify you by email as soon as it goes live.'
        : o.status === 'approved' || o.status === 'scheduled'
        ? 'Approved! Your ad will begin airing shortly according to the schedule.'
        : o.status === 'playing'
        ? 'Your ad is currently live on the LED display.'
        : o.status === 'completed'
        ? 'Your campaign has finished. Thanks for advertising with MediAd View.'
        : o.status === 'payment_failed' || o.status === 'cancelled'
        ? 'This order did not complete. Please try again or contact support.'
        : 'You can refresh this page anytime to see the latest status.'}
    </div>
  `;
  document.getElementById('app').innerHTML = html;
}

load();
</script>
</body>
</html>
