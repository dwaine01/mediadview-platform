<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MediaView — Digital Signage Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/api/web/styles.css">
</head>
<body>

<!-- ====== LOGIN ====== -->
<div id="view-login">
  <div class="orb" style="width:450px;height:450px;top:-180px;right:-120px;background:radial-gradient(circle,rgba(99,102,241,.09),transparent 70%)"></div>
  <div class="orb" style="width:350px;height:350px;bottom:-120px;left:-100px;background:radial-gradient(circle,rgba(34,211,238,.05),transparent 70%)"></div>

  <div class="login-card fade-in">
    <div class="login-logo">
      <div class="icon">MV</div>
      <h1>MediaView</h1>
      <p>Digital Signage Platform</p>
    </div>
    <div class="glass" style="border-radius:var(--radius);padding:32px">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:4px">Welcome back</h2>
      <p style="font-size:13px;color:var(--t-3);margin-bottom:28px">Sign in to your account</p>
      <div>
        <label class="input-label">Email</label>
        <input id="in-email" type="email" class="input" placeholder="admin@mediaviewads.com" style="margin-bottom:18px">
        <label class="input-label">Password</label>
        <input id="in-pwd" type="password" class="input" placeholder="Enter your password" style="margin-bottom:24px">
        <button onclick="doLogin()" class="btn-primary" style="width:100%;justify-content:center;padding:14px">Sign In</button>
      </div>
      <p id="login-err" style="color:var(--red);font-size:13px;text-align:center;margin-top:16px;display:none"></p>
    </div>
  </div>
</div>

<!-- ====== APP ====== -->
<div id="view-app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">MV</div>
      <div><div class="name">MediaView</div><div class="sub">Digital Signage</div></div>
    </div>
    <nav>
      <div class="nav-link active" data-p="dashboard" onclick="go('dashboard')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</div>
      <div class="nav-link" data-p="screens" onclick="go('screens')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>Screens</div>
      <div class="nav-link" data-p="campaigns" onclick="go('campaigns')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6"/></svg>Campaigns</div>
      <div class="nav-link" data-p="payments" onclick="go('payments')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>Payments</div>
      <div class="nav-sep"></div>
      <div class="nav-link" data-p="devices" onclick="go('devices')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Devices</div>
      <div class="nav-link" data-p="settings" onclick="go('settings')"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</div>
    </nav>
    <div class="sidebar-footer">
      <div class="av" id="sb-av">U</div>
      <div style="flex:1;min-width:0"><div id="sb-name" style="font-size:11px;font-weight:600;color:var(--t-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">User</div><div id="sb-email" style="font-size:9px;color:var(--t-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">email</div></div>
      <button onclick="doLogout()" style="background:none;color:var(--t-4);padding:4px" title="Sign out"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <div id="pg-dashboard" class="page on"></div>
    <div id="pg-screens" class="page"></div>
    <div id="pg-campaigns" class="page"></div>
    <div id="pg-payments" class="page"></div>
    <div id="pg-devices" class="page"></div>
    <div id="pg-settings" class="page"></div>
  </div>
</div>

<script src="/api/web/app.js"></script>
</body>
</html>
